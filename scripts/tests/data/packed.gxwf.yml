format-version: v2.0
$graph:
  - id: concat-twice
    class: GalaxyWorkflow
    inputs:
      inner_input: data
    outputs:
      inner_output:
        outputSource: cat/out_file1
    steps:
      cat:
        tool_id: cat1
        in:
          input1: inner_input
  - id: main
    class: GalaxyWorkflow
    label: Packed fixture
    inputs:
      outer_input: data
    outputs:
      outer_output:
        outputSource: nested/inner_output
    steps:
      nested:
        run: "#concat-twice"
        in:
          inner_input: outer_input
