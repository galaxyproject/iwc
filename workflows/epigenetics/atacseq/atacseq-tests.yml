- doc: Test outline for ATACseq
  job:
    PE fastq input:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        collection_type: paired
        identifier: SRR891268_chr22_enriched
        elements:
        - identifier: forward
          class: File
          location: https://zenodo.org/record/3862793/files/SRR891268_chr22_enriched_R1.fastq.gz
          filetype: fastqsanger.gz
          hashes:
          - hash_function: SHA-1
            hash_value: 0fd546fe61d5dcdec0d91c91c6ad02b4de1b40fc
        - identifier: reverse
          class: File
          location: https://zenodo.org/record/3862793/files/SRR891268_chr22_enriched_R2.fastq.gz
          filetype: fastqsanger.gz
          hashes:
          - hash_function: SHA-1
            hash_value: 8572153e721ba209a716128854b4560664bdf23d
    Percentage of bad quality bases per read: 70
    Reference Genome: hg19
    Effective genome size: 2700000000
    Bin size: 1000
    Gene annotation file:
      class: File
      location: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_19/gencode.v19.annotation.gtf.gz
      filetype: gtf.gz
      hashes:
      - hash_function: SHA-1
        hash_value: 2e0b01b051d91baf17f38ac7d42cf2449c151709
    Compute TSS enrichment Genome-wide: false
    Compute TSS enrichment on a specific chromosome: chr22
  outputs:
    mapping stats:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
          - that: "has_text"
            text: "9407 (3.33%) aligned concordantly 0 times"
          - that: "has_text"
            text: "153749 (54.35%) aligned concordantly exactly 1 time"
          - that: "has_text"
            text: "119723 (42.32%) aligned concordantly >1 times"
    MarkDuplicates metrics:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_text:
              text: "0.02"
    BAM filtered rmDup:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_size:
              value: 15810403
              delta: 1000000
    TSS Enrichment Score:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_n_lines:
              n: 1
            has_line:
              line: "5.7435"
    histogram of fragment length:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_size:
              value: 47718
              delta: 4000
    MACS2 narrowPeak:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_n_lines:
              n: 237
    MACS2 report:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
          - that: "has_text"
            text: "# tag size is determined as 47 bps"
          - that: "has_text"
            text: "# total tags in treatment: 261890"
    Coverage from MACS2 (bigwig):
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_size:
              value: 2892925
              delta: 200000
    1kb around summits:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_n_lines:
              n: 220
    Nb of reads in summits +-500bp:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_line:
              line: "9522"
    bigwig_norm:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_size:
              value: 1253177
              delta: 100000
    bigwig_norm2:
      class: Collection
      element_tests:
        SRR891268_chr22_enriched:
          asserts:
            has_size:
              value: 1248419
              delta: 100000
    'MultiQC on input dataset(s): Stats':
      asserts:
        has_line:
          line: "Sample	macs2-d	macs2-peak_count	picard_mark_duplicates-PERCENT_DUPLICATION	bowtie_2_hisat2-overall_alignment_rate	fastp-after_filtering_q30_rate	fastp-after_filtering_q30_bases	fastp-filtering_result_passed_filter_reads	fastp-after_filtering_gc_content	fastp-pct_surviving_reads	fastp-pct_surviving_bases	fastp-pct_adapter	fastp-before_filtering_read1_mean_length	fastp-before_filtering_read2_mean_length"
        has_text_matching:
          expression: "SRR891268_chr22_enriched\t200.0\t237\t2.6[0-9]*\t98.[0-9]*\t97.[0-9]*\t26.[0-9]*\t0.5[0-9]*\t47.[0-9]*\t99.[0-9]*\t97.[0-9]*\t13.[0-9]*\t50.0\t50.0"

    MultiQC webpage:
      asserts:
      - that: "has_text"
        text: '<a href="#fastp" class="nav-l1">fastp</a>'
      - that: "has_text"
        text: "<td>% Aligned</td>"
      - that: "has_text"
        text: ">TSSE</a>"
