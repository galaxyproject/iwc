class: GalaxyWorkflow
label: Read-level haplotype typing (window strings, no curated nomenclature)
doc: >-
  Type a cohort of amplicon specimens from reads, end to end, without a curated
  haplotype catalogue.

  Paired FASTQ per specimen -> bwa mem against the amplicon panel -> MAPQ>=20 +
  proper-pair filter -> windows sized from the cohort's own fragment-length
  distribution -> per-specimen haplotypes read off spanning reads and named by
  their own content -> one sheet -> PyEuk distance and clustering.

  Panel- and species-agnostic. The only inputs are reads and the panel FASTA;
  everything else is derived. It has been run unchanged on the CDC Cyclospora
  8-marker panel and on a Cryptosporidium 18S species-mixture titration.

  Three things about the shape of this graph are deliberate.

  1. define_windows is a REDUCTION over the whole BAM collection, not a per-specimen
  step. Windows must be identical for every specimen or the sheet's columns do not
  correspond across rows. That is why the collection enters it whole and the
  resulting BED then fans back out to every specimen.

  2. The haplotype is read off reads that span a window END TO END, so it is an
  observation on one molecule rather than an inference across molecules. This is the
  whole point: per-site variant calling records mutations independently of the
  molecule carrying them, and therefore cannot tell one strain carrying N mutations
  from a mixture in which a second strain contributes them. Measured on a
  Cryptosporidium titration with known proportions, this graph detects and correctly
  identifies every component of every mixture, including a three-way mix.

  3. min_freq is a HAPLOTYPE frequency, not a per-site allele frequency. Per-site
  frequency is a sum over every haplotype carrying that site, so thresholding it can
  accept some sites of a minor haplotype and reject others, assembling a genotype no
  molecule carries. Thresholding haplotype frequency cannot do that.

  Window length trades linkage against sequencing error and is worth checking per
  panel. Measured on a Cryptosporidium mixture titration with known proportions: at
  250 bp a pure control matched its own string in 62% of reads and both 75:25
  mixtures were reported as a SINGLE haplotype, the minor component having
  fragmented below the frequency gate; at 100 bp the control reached 79% and every
  mixture resolved. window_max is the control for this and the default is 100.
creator:
  - class: Person
    identifier: https://orcid.org/0000-0002-5987-8032
    name: Anton Nekrutenko
  - class: Person
    name: Claude Opus 5
license: MIT
release: "0.1"

inputs:
  reads:
    type: collection
    collection_type: list:paired
    doc: >-
      Adapter/quality-trimmed paired FASTQ, one pair per specimen. The list element
      identifier IS the specimen id: it becomes column 1 of the calls and the row id
      of the sheet, so it must match [A-Za-z0-9_.-]+.
    position: {top: 0, left: 0}
  min_span:
    type: int
    default: 30
    doc: >-
      Minimum TOTAL fully-spanning reads for a window to be called at all. Applied before
      any haplotype is considered, so it is the first gate a window has to clear -- and on
      the Cyclospora 2018 cohort it was the binding one. Measured by holding the BAMs and
      windows fixed and sweeping only this value: min_span 24-42 is a flat plateau at ARI
      0.9737 against the vendor labels with a single specimen misassigned, and between 42
      and 44 it falls to 0.7536 with ten misassigned. The previous default of 50 sat on the
      wrong side of that cliff. Note this gate is harder on MIXED specimens than clonal
      ones: k co-infecting genotypes split the spanning reads k ways, so a mixture needs
      k times the depth of a clonal sample to clear the same value. 30 is a Cyclospora
      result, not a universal constant -- on a cohort with different amplicon lengths or
      insert sizes, sweep it again rather than assuming it transfers.
  min_freq:
    type: float
    default: 0.05
    doc: >-
      Minimum HAPLOTYPE frequency -- the fraction of spanning reads carrying an entire
      string. Exposed because the right value is dataset-dependent and the default is not
      general. 0.05 was carried over from a Cryptosporidium titration whose minor
      components were 25-75%, so anything below the gate was never exercised there. On a
      cohort containing 1% components, 0.05 makes them undetectable BY CONSTRUCTION --
      every observed frequency then piles up just above the gate. Set 0.005 or lower to
      probe a low-frequency detection floor, and let min_reads suppress noise instead.
  min_reads:
    type: int
    default: 10
    doc: >-
      Minimum supporting reads per haplotype. This is the noise control that should do the
      work when min_freq is lowered: at 10 reads a haplotype needs real support regardless
      of how small a fraction it represents.
  panel:
    type: data
    doc: >-
      The amplicon panel FASTA. Used twice, and on purpose by the same dataset: as the
      bwa mem reference and as the reference the haplotype strings are described
      against. A haplotype name is a difference from THIS sequence, so a different
      dataset here silently renames every haplotype.
    position: {top: 240, left: 0}

  project_psd:
    type: boolean
    default: false
    doc: >-
      Project the distance matrix onto the PSD cone by Gram double centering. DEFAULT FALSE.
      The projection guarantees the distances embed in Euclidean space, which Ward linkage
      assumes, but it buys that by compressing the closest pairs: measured on the CDC AmpliSeq
      cohort it left the median pair at 0.174 against 0.184 while inflating the closest 1% from
      0.0048 to 0.0946, a factor of 19.6. Tight pairs are precisely what a relatedness measure
      exists to resolve. Turning it off improved the pairwise AUC on all four labelled
      comparisons available, and in error counts took Cyclospora from 3 wrong of 153 to 1, and
      PvAmpSeq from 5 wrong of 277 to 2.
      Set TRUE together with cut=distance, where the regularised geometry helps instead: CDC
      scores ARI 0.7952 against the published clusters with the projection on and 0.6805 with
      it off.
  cut:
    type: text
    default: count
    doc: >-
      "count" or "distance". Two different questions, not two qualities of answer.
      count splits the cohort into k groups, k chosen from the largest merge-height gap subject
      to a minimum relative gap and a minimum cluster size. Right for a closed investigation
      where every specimen belongs somewhere.
      distance cuts at a fixed dissimilarity, with no k and no gap requirement, and returns
      specimens with no near neighbour as singletons. Right for surveillance, where most cases
      are unrelated. A cluster count cannot represent a structure that is mostly singletons: on
      the CDC cohort, whose published truth is 93 groups with 79 singletons, the count rule
      rejects every k that could reproduce it and returns 1.
  linkage_threshold:
    type: float
    optional: true
    doc: >-
      Dissimilarity at which to cut when cut=distance. Leave unset to calibrate it from the
      data; the tool prints the value and where it came from rather than presenting it as a
      constant.
  min_completeness:
    type: float
    default: 0.1
    doc: >-
      Minimum fraction of loci a specimen must have called to enter the distance matrix.
      Panel-dependent, so there is no universal value. Raise it when the cohort has a
      low-completeness tail that would otherwise produce distances pinned at the engine's
      no-shared-data ceiling: on CDC AmpliSeq five specimens sit at 0.46-0.48 while the median
      is 0.945, and they generate six pairs at distance 1.0 against a real maximum of 0.2888.
      Four of those five are the specimens the source publication itself marks as insufficient
      for clustering.

outputs:
  filtered_bam:
    outputSource: filter_bam/outputsam
    doc: Per-specimen BAM, MAPQ>=20 + proper pairs, coordinate sorted.
  windows:
    outputSource: define_windows/windows
    doc: >-
      The windows this cohort was typed on. Part of the result, not an intermediate:
      the haplotype names only mean anything relative to these intervals.
  calls:
    outputSource: call_haplotypes/calls
    doc: Per-specimen window haplotype calls, with read counts and frequencies.
  sheet:
    outputSource: build_sheet/sheet
    doc: >-
      Rows = specimens, columns = observed haplotypes, X = present. An entirely empty
      locus block means NOT CALLED; "amplified and reference-identical" is the
      ordinary haplotype "=", so the two are distinguishable.
  haplotype_map:
    outputSource: build_sheet/hapmap
    doc: Column name -> window, interval, and the content-derived haplotype string.
  calls_long:
    outputSource: build_sheet/calls_long
    doc: >-
      Long-format calls with read frequency. This is where mixtures live; the binary
      sheet cannot carry them.
  distance_matrix:
    outputSource: pyeuk/distance_matrix
  clusters:
    outputSource: pyeuk/clusters

steps:
  index_panel:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bwa_mem2/bwa_mem2_idx/2.3+galaxy0
    label: index_panel
    doc: >-
      Build the panel index ONCE and reuse it for every specimen.

      With bwa_mem and a history reference, Galaxy rebuilds the index inside every mapping
      job -- 187 redundant builds of the same 11 kb panel for a 187-specimen cohort. The
      index is a property of the panel, not of the specimen, so it belongs upstream of the
      fan-out. bwa_mem2's mapper accepts a bwa_mem2_index dataset directly, which makes
      this expressible.
    in:
      reference: panel
    out:
      index: {}
    position: {top: 180, left: 300}

  map_reads:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bwa_mem2/bwa_mem2/2.3+galaxy0
    label: map_reads
    doc: >-
      Map to the whole panel, not to one amplicon. Reads from every marker then have
      somewhere correct to go instead of being forced onto a single target.

      Takes the prebuilt index rather than the FASTA, so no indexing happens here.
    in:
      reference_source|ref_file: index_panel/index
      fastq_input|fastq_input1: reads
    state:
      reference_source:
        reference_source_selector: history
      fastq_input:
        fastq_input_selector: paired_collection
        iset_stats: ''
      rg:
        rg_selector: do_not_set
      analysis_type:
        analysis_type_selector: illumina
      output_sort: coordinate
    out:
      bam_output: {}
    position: {top: 0, left: 300}

  filter_bam:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    label: filter_bam
    doc: >-
      samtools view -b -q 20 -f 2 -F 3852. -F 3852 is 4+8+256+512+1024+2048: unmapped,
      mate unmapped, secondary, QC fail, duplicate, supplementary. What survives is the
      set of reads whose aligned subsequence over a window can be trusted as a string.
    in:
      input: map_reads/bam_output
    state:
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: 'no'
          cond_rg:
            select_rg: 'no'
          cond_expr:
            select_expr: 'no'
          quality: 20
          inclusive_filter: ['2']
          exclusive_filter: ['4', '8', '256', '512', '1024', '2048']
          exclusive_filter_all: []
          library: ''
          cigarcons: ''
          tag: ''
          qname_file: null
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1.0
            seed: ''
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            collapsecigar: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: 'no'
    out:
      outputsam: {}
    position: {top: 0, left: 620}

  define_windows:
    tool_id: haplotype_define_windows
    label: define_windows
    doc: >-
      Cohort-level reduction. Scans a sample of the BAMs and sizes windows per
      reference sequence from the aligned block length distribution, then tiles only
      the region reads actually reach. Per reference sequence and not pooled, because
      amplicons differ in depth and fragment length: one cohort-wide size is set by
      whichever amplicon is deepest and is then too wide for the shallow ones, which
      lose their locus entirely.
    in:
      bams: filter_bam/outputsam
      reference_source|ref_file: panel
    state:
      reference_source:
        reference_source_selector: history
      sample: 20
      min_spanning: 0.30
      legacy_spanning_target: ''
      min_depth: 20
      window_min: 40
      window_max: 0
      width_step: 10
      step: 0
    out:
      windows: {}
    position: {top: 240, left: 940}

  call_haplotypes:
    tool_id: haplotype_window_caller
    label: call_haplotypes
    doc: >-
      Maps over the BAM collection; every specimen gets the SAME windows. Specimen id
      left blank so the tool uses the collection element identifier. All three gates are
      exposed as workflow parameters: min_span spanning reads for the window to be called
      at all, then min_reads and min_freq for a haplotype within it. min_span fires first
      and is usually the one that decides whether a window survives.
    in:
      input: filter_bam/outputsam
      reference_source|ref_file: panel
      windows: define_windows/windows
      gates|min_span: min_span
      gates|min_freq: min_freq
      gates|min_reads: min_reads
    state:
      reference_source:
        reference_source_selector: history
      specimen: ''
      gates:
        denoise_edits: 1
        denoise_ratio: 8.0
    out:
      calls: {}
    position: {top: 0, left: 1260}

  build_sheet:
    tool_id: haplotype_window_sheet
    label: build_sheet
    doc: >-
      Reduction: the sheet only means anything across specimens.

      min_maf DEFAULTS TO 0, i.e. off. It was 0.05, justified by PyEuk weighting a column
      1/sqrt(p(1-p)) -- minimised at p=0.5, divergent as p approaches 0, so rare alleles
      dominate. The pinned engine has not used that weighting since PyEuk 0.4.0: it defaults
      to heterozygosity 2p(1-p), under which rare columns hold 2.8% of the weight rather
      than 64.7%. The rationale was obsolete and the filter was doing measurable harm. At
      0.05 on the Cyclospora cohort it deleted 33 of 48 columns and 19 of 28 windows, turned
      2,443 called specimen-windows into empty locus blocks PyEuk reads as NOT CALLED, and
      left 82 specimen pairs sharing no locus at all -- their distance is then 1.0 by
      construction, not by measurement (max distance 1.3746 at 0.05, 0.7172 at 0). Scored
      against the vendor labels: ARI 0.9737 at 0.05 against 1.0000 at 0. On the
      Cryptosporidium titration it changes nothing -- same k=2, same 4/6 split, same
      pure-species controls on the correct sides, two extra columns.

      Caveat, measured not assumed: across five independently derived window sets on the
      same specimens, min_maf=0 gave 1.0000 on three, 0.9223 on one and 0.8001 on one, while
      0.05 spanned a narrower 0.87-0.97. Zero raises the ceiling and widens the spread across
      windowings. Our deployed windowing is among the good ones, which is a property of this
      cohort rather than a general guarantee.

      p is a fraction of SPECIMENS, not reads, so minor haplotypes within a mixture are
      untouched either way.
    in:
      calls_in: call_haplotypes/calls
    state:
      min_freq: 0.0
      min_reads: 0
      min_maf: 0
    out:
      sheet: {}
      hapmap: {}
      calls_long: {}
    position: {top: 120, left: 1580}

  pyeuk:
    tool_id: haplotype_pyeuk
    label: pyeuk
    doc: >-
      LABEL-FREE: no gold file. Supplying labels here would make the clustering a fit
      rather than a prediction.

      Resolves against PyEuk at current master, NOT the d8e45a81 pin the Cyclospora
      LoFreq/PyEuk arm uses. Two post-pin fixes are required here: 37f59a3, without which
      unobserved allele columns compress every distance about fivefold, and 13b808d, without
      which the minimum-cluster-size guard makes k>1 unreachable for any cohort of n<=9 and
      collapsed a 10-specimen 3-species cohort to k=1.
    in:
      sheet: build_sheet/sheet
      advanced|project_psd: project_psd
      advanced|cut: cut
      advanced|linkage_threshold: linkage_threshold
      advanced|min_completeness: min_completeness
    state:
      advanced:
        k_min: 2
        k_max: 50
        report_excluded: true
    out:
      distance_matrix: {}
      clusters: {}
    position: {top: 120, left: 1900}
