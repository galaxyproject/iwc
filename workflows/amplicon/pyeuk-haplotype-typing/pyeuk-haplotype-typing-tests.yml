        elements:
        - identifier: forward
          class: File
          path: test-data/A4_R1.fastqsanger.gz
          filetype: fastqsanger.gz
        - identifier: reverse
          class: File
          path: test-data/A4_R2.fastqsanger.gz
          filetype: fastqsanger.gz
      - class: Collection
        type: paired
        identifier: B1
        elements:
        - identifier: forward
          class: File
          path: test-data/B1_R1.fastqsanger.gz
          filetype: fastqsanger.gz
        - identifier: reverse
          class: File
          path: test-data/B1_R2.fastqsanger.gz
          filetype: fastqsanger.gz
      - class: Collection
        type: paired
        identifier: B2
        elements:
        - identifier: forward
          class: File
          path: test-data/B2_R1.fastqsanger.gz
          filetype: fastqsanger.gz
        - identifier: reverse
          class: File
          path: test-data/B2_R2.fastqsanger.gz
          filetype: fastqsanger.gz
      - class: Collection
        type: paired
        identifier: B3
        elements:
        - identifier: forward
          class: File
          path: test-data/B3_R1.fastqsanger.gz
          filetype: fastqsanger.gz
        - identifier: reverse
          class: File
          path: test-data/B3_R2.fastqsanger.gz
          filetype: fastqsanger.gz
      - class: Collection
        type: paired
        identifier: B4
        elements:
        - identifier: forward
          class: File
          path: test-data/B4_R1.fastqsanger.gz
          filetype: fastqsanger.gz
        - identifier: reverse
          class: File
          path: test-data/B4_R2.fastqsanger.gz
          filetype: fastqsanger.gz
    Amplicon panel:
      class: File
      path: test-data/panel.fasta
      filetype: fasta
    Tree cut method: distance
  outputs:
    Haplotype windows:
      asserts:
      - has_n_lines:
          n: 4
      - has_line:
          line: "M1\t0\t100\tM1_W0001"
      - has_line:
          line: "M1\t100\t150\tM1_W0101"
      - has_line:
          line: "M2\t0\t100\tM2_W0001"
      - has_line:
          line: "M2\t100\t150\tM2_W0101"
    Haplotype sheet:
      asserts:
      - has_n_lines:
          n: 9
      - has_n_columns:
          n: 7
      - has_line:
          line: "Seq_ID\tM1_W0001_Hap_1\tM1_W0001_Hap_2\tM1_W0101_Hap_1\tM2_W0001_Hap_1\tM2_W0001_Hap_2\tM2_W0101_Hap_1"
    Haplotype map:
      asserts:
      - has_n_lines:
          n: 7
      - has_line_matching:
          expression: 'M1_W0001_Hap_\d\tM1_W0001\tM1\t1\t100\t76T>C\t4'
      - has_line_matching:
          expression: 'M2_W0001_Hap_\d\tM2_W0001\tM2\t1\t100\t61C>A\t4'
      - has_line_matching:
          expression: 'M[12]_W0101_Hap_1\tM[12]_W0101\tM[12]\t101\t150\t=\t8'
          n: 2
    Long-format haplotype calls:
      asserts:
      - has_n_lines:
          n: 33
    Distance matrix:
