          filetype: fastqsanger.gz
        - identifier: reverse
          class: File
          path: test-data/A2_R2.fastqsanger.gz
          filetype: fastqsanger.gz
      - class: Collection
        type: paired
        identifier: A3
        elements:
        - identifier: forward
          class: File
          path: test-data/A3_R1.fastqsanger.gz
          filetype: fastqsanger.gz
        - identifier: reverse
          class: File
          path: test-data/A3_R2.fastqsanger.gz
          filetype: fastqsanger.gz
      - class: Collection
