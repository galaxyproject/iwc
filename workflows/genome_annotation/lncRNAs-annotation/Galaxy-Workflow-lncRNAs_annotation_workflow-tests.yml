- doc: Test outline for Galaxy-Workflow-lncRNAs_annotation_workflow.ga
  job:
    Genome assembly:
      class: File
      location: https://zenodo.org/records/11367439/files/genome_assembly.fasta
      filetype: fasta
    Genome annotation:
      class: File
      location: https://zenodo.org/records/11367439/files/genome_annotation.gff3
      filetype: gff3
    Alignments from RNA-seq:
      class: File
      location: https://zenodo.org/records/14726111/files/SRR8534859_RNASeq_mapped_small_version.bam
      filetype: bam
    strandedness: 'unstranded'

  
  outputs:
    annotation:
      asserts:
        - has_n_lines:
            n: 137448
        - has_text:
            text: "funannotate"
            text: "transcript"   
    
    stringtie gtf:
      asserts:
        - has_n_lines:
            n: 78999
            delta: 1600
        - has_text:
            text: "StringTie version 3.0.3"
            text: "transcript" 
    
    
    candidate lncRNA:
      asserts:
        - has_n_lines:
            n: 244
            delta: 12
        - has_text:
            text: "StringTie"
            text: "scaffold_21"   
    classification:
      asserts:
        - has_n_lines:
            n: 725
            delta: 36
        - has_text:
            text: "STRG.6410"
            text: "antisense"   
    
    
    annotation final:
      asserts:
        - has_n_lines:
            n: 137692
            delta: 12
        - has_text:
            text: "funannotate"
            text: "StringTie"   
    