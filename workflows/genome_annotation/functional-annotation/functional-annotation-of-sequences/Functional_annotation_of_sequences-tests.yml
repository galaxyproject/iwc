- doc: Test outline for Functional_annotation_of_sequences.ga for protein 
  job:
    Sequence collection:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: test-sequence
        location: https://zenodo.org/record/8414802/files/protein_sequences.fasta
        filetype: fasta
        hashes:
        - hash_function: SHA-1
          hash_value: 0e1026d6917ac03bcd174a85b18e69c2a6470f98
    Run eggNOG + completeness calculation: true
    Run InterProScan: true
    eggNOG mode select: proteins
    InterProScan mode select: Protein
    Generate eggNOG annotation abundance tables: false
  outputs:
    interproscan xml:
      class: Collection
      element_tests:
        test-sequence:
          location: https://zenodo.org/records/13951790/files/interProScan.xml?download=1&preview=1
          compare: sim_size
          delta: 7000000
    interproscan tabular:
      class: Collection
      element_tests:
        test-sequence:
          location: https://zenodo.org/records/13951790/files/interProScan.tabular?download=1&preview=1
          compare: sim_size
          delta: 2000000
    kegg pathways table:
      asserts:
        - that: "has_text"
          text: "module_accession	completeness	pathway_name	pathway_class	matching_ko	missing_ko"
    kegg contig table:
      asserts:
        - that: "has_text"
          text: "contig	module_accession	completeness	pathway_name	pathway_class	matching_ko	missing_ko"
- doc: Test outline for Functional_annotation_of_protein_sequences.ga for metagenome
  job:
    Sequence collection:
      class: Collection
      collection_type: list
      elements:
        - class: File
          identifier: 50contig_reads_binette_bin1.fasta
          location: https://zenodo.org/records/18635101/files/50contig_reads_binette_bin2.fasta
        - class: File
          identifier: 50contig_reads_binette_bin2.fasta
          location: https://zenodo.org/records/18635101/files/50contig_reads_binette_bin3.fasta
    Run eggNOG + completeness calculation: true
    Run InterProScan: false
    eggNOG mode select: metagenome
    InterProScan mode select: DNA/RNA
  outputs:
    kegg pathways table:
      asserts:
        - that: "has_text"
          text: "module_accession	completeness	pathway_name	pathway_class	matching_ko	missing_ko"
        - that: "has_n_lines"
          n: 4
          delta: 1
    kegg contig table:
      asserts:
        - that: "has_text"
          text: "contig	module_accession	completeness	pathway_name	pathway_class	matching_ko	missing_ko"
        - that: "has_n_lines"
          n: 4
          delta: 1
    GO abundances (eggNOG-mapper):
      asserts:
      - that: has_n_columns
        n: 3
      - that: has_line
        line: "#KEY\t50contig_reads_binette_bin1.fasta\t50contig_reads_binette_bin2.fasta"
      - that: has_line
        line: "unannotated\t2\t2"
    KEGG KO abundances (eggNOG-mapper):
      asserts:
      - that: has_n_columns
        n: 3
      - that: has_line
        line: "ko:K00931\t1\t0"
      - that: has_line
        line: "ko:K17686\t0\t1"
    eggNOG-mapper annotation abundance table:
      asserts:
      - that: has_n_columns
        n: 4
      - that: has_line
        line: "Annotation type\tAnnotation\t50contig_reads_binette_bin1.fasta\t50contig_reads_binette_bin2.fasta"
      - that: has_line
        line: "KEGG KO\tko:K00931\t1\t0"
      - that: has_line
        line: "GO\tunannotated\t2\t2"
