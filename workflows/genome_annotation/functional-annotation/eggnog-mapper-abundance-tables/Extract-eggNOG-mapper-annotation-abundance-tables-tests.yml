- doc: Regression test for a sample without terms of some annotation types (sample_B has no GO, EC, KEGG pathway/module/reaction/rclass, TC, CAZy or BiGG terms); per-sample columns must stay aligned. sample_A also has a multi-letter COG category (KT).
  job:
    eggNOG-mapper annotations:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: sample_A
        path: test-data/synthetic_sample_A.eggnog-mapper.tabular
        filetype: tabular
      - class: File
        identifier: sample_B
        path: test-data/synthetic_sample_B.eggnog-mapper.tabular
        filetype: tabular
      - class: File
        identifier: sample_C
        path: test-data/synthetic_sample_C.eggnog-mapper.tabular
        filetype: tabular
  outputs:
    eggNOG OG abundances (eggNOG-mapper):
      asserts:
        - that: "has_n_lines"
          n: 8
        - that: "has_n_columns"
          n: 4
          comment: "#"
        - that: "has_line"
          line: "COG0003@1|root\t0\t1\t1"
    GO abundances (eggNOG-mapper):
      asserts:
        - that: "has_n_lines"
          n: 4
        - that: "has_line"
          line: "#KEY\tsample_A\tsample_B\tsample_C"
        - that: "has_n_columns"
          n: 4
          comment: "#"
        - that: "has_line"
          line: "GO:0003674\t2\t0\t1"
        - that: "has_line"
          line: "GO:0008150\t1\t0\t2"
        - that: "has_line"
          line: "unannotated\t0\t2\t0"
    KEGG KO abundances (eggNOG-mapper):
