- doc: Test outline for Extract-eggNOG-mapper-annotation-abundance-tables
  job:
    eggNOG-mapper annotations:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: 50contig_reads_binette_bin2
        location: https://zenodo.org/records/23063714/files/50contig_reads_binette_bin2_eggnog-mapper.tabular
      - class: File
        identifier: 50contig_reads_binette_bin3
        location: https://zenodo.org/records/23063714/files/50contig_reads_binette_bin3_eggnog-mapper.tabular?download=1
  outputs:
    eggNOG OG abundances (eggNOG-mapper):
      asserts:
        - that: "has_n_lines"
          n: 17
        - that: "has_n_columns"
          n: 3
        - that: "has_text"
          text: "1TP5S@1239|Firmicutes"
