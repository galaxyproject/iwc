# Which collection(s) of https://dockstore.org/organizations/iwc each workflow is in.
#
# scripts/dockstore_collections.py checks this file on every pull request, so a
# workflow can't be merged without a collection, and applies it to Dockstore
# once a day. See "Dockstore collections" in workflows/README.md.

# The Dockstore organization that owns the collections
organization: iwc

# The collections, keyed by their name in the Dockstore URL. A collection that
# doesn't exist yet is created from displayName and topic. Both are only used
# then: to change an existing collection, edit it on Dockstore.
collections:
  bacterial-genomics:
    displayName: Bacterial Genomics
    topic: Bacterial Genomics
  comparative-genomics:
    displayName: Comparative Genomics
    topic: Comparative Genomics
  ComputationalChemistry:
    displayName: Computational Chemistry
    topic: Workflows for Computational Chemistry
  Covid:
    displayName: SARS-COV-2
    topic: SARS-COV-2 Workflows
  data-manipulation:
    displayName: Data Manipulation
    topic: Generic workflows that filter and reshape tabular data
  data-organization:
    displayName: Data Organization
    topic: Generic workflows that reorganize datasets/collections
  datafetching:
    displayName: Data Fetching
    topic: Workflows that fetch data from remote resources
  epigenetics:
    displayName: Epigenetics
    topic: Chromatin marks, histones, transcription factors, chromatin accessibility, DNA methylation
  genome-annotation:
    displayName: Genome Annotation
    topic: Workflows that help in making sense of genomes
  genome-assembly:
    displayName: Genome assembly
    topic: Workflows for genome assembly
  Imaging:
    displayName: Imaging
    topic: Workflows for Imaging Analysis
  machine-learning:
    displayName: Machine Learning
    topic: Workflows that train and apply machine learning models
  Metabarcoding:
    displayName: Metabarcoding
    topic: Workflows for the analysis of metabarcoded data
  metabolomics:
    displayName: Metabolomics
    topic: Workflows for analysis of Metabolomics data
  metagenomics:
    displayName: Metagenomics
    topic: Workflows for metagenomic analysis
  Metaproteomics:
    displayName: Metaproteomics
    topic: Metaproteomics analysis workflows
  Microbiome:
    displayName: Microbiome
    topic: Workflows for microbiome analysis
  preprocessing:
    displayName: Quality Control and Pre-processing
    topic: Quality Control and Pre-processing
  proteomics:
    displayName: Proteomics
    topic: Proteomic Analysis
  single-cell:
    displayName: Single Cell
    topic: Single Cell Analysis
  transcriptomics:
    displayName: Transcriptomics
    topic: Workflows for transcriptomics analysis
  variant-calling:
    displayName: Variant Calling
    topic: Variant Calling
  vgp:
    displayName: Vertebrate Genome Project
    topic: Galaxy Workflows for the Vertebrate Genome Project
  Virology:
    displayName: Virology
    topic: Workflow for Virology

# <directory under workflows/>: [collection names]
#
# A directory's collections apply to every workflow below it. The most specific
# directory wins and replaces the less specific one, it doesn't add to it.
assignments:
  VGP-assembly-v2: [vgp]

  amplicon: [Metabarcoding]
  amplicon/amplicon-mgnify: [Microbiome]

  bacterial_genomics: [bacterial-genomics]
