  bacterial_genomics/bacterial_genome_annotation: [genome-annotation]
  bacterial_genomics/bacterial-quality-and-contamination-control-post-assembly: [bacterial-genomics, metagenomics, Microbiome]

  comparative_genomics: [comparative-genomics]

  computational-chemistry: [ComputationalChemistry]

  data-fetching: [datafetching]

  data-organization: [data-organization]

  epigenetics: [epigenetics]
  epigenetics/average-bigwig-between-replicates: [epigenetics, transcriptomics]

  genome-assembly: [genome-assembly]
  genome-assembly/quality-and-contamination-control-raw-reads: [bacterial-genomics]

  genome_annotation: [genome-annotation]

  imaging: [Imaging]

  machine-learning: [machine-learning]

  metabolomics: [metabolomics]
  metabolomics/gcms-metams: [metabolomics, ComputationalChemistry]
  metabolomics/lcms-preprocessing: [metabolomics, ComputationalChemistry]
  metabolomics/qcxms-sdf: [metabolomics, ComputationalChemistry]

  microbiome: [Microbiome]
  microbiome/host-contamination-removal: [Microbiome, metagenomics]
  microbiome/metagenomic-genes-catalogue: [Microbiome, metagenomics, genome-annotation]
