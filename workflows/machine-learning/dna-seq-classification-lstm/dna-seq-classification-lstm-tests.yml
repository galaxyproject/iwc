- doc: Test outline for dna-seq-classification-lstm.ga
  job:
    DNA sequence labels:
      class: File
      path: "test-data/dna-sequence-labels.tabular"
      filetype: "tabular"
    DNA sequences:
      class: File
      path: "test-data/dna-sequence.fasta"
      filetype: "fasta"
  outputs:
    'Predicted labels (test set)':
      asserts:
        has_n_columns:
          n: 1
        has_n_lines:
          n: 320
        has_text:
          text: "Predicted"
    'Evaluation metrics (validation set)':
      asserts:
        has_n_columns:
          n: 5
        has_n_lines:
          n: 2
        has_text:
          text: "f1_macro"
    'Predicted label probabilities (test set)':
      asserts:
        has_n_columns:
          n: 3
        has_n_lines:
          n: 320
    'Confusion matrix (test set)':
      path: test-data/confusion_matrix.png
      compare: image_diff