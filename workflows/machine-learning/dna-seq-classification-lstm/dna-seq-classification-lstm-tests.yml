- doc: Test outline for dna-seq-classification-lstm.ga (fixed-length sequences)
  job:
    DNA sequence labels:
      class: File
      path: "test-data/dna-sequence-labels.tabular"
      filetype: "tabular"
    DNA sequences:
      class: File
      path: "test-data/dna-sequence.fasta"
      filetype: "fasta"
    K-mer size: 3
    LSTM layer units: 256
    Embedding output dimensions: 128
    Dense layer units: 64
    Number of training epochs: 10
    Batch size: 32
  outputs:
    'Encoding vocabulary':
      asserts:
        - that: has_text
          text: '"EI": 0'
    'Predicted labels (test set)':
      asserts:
        has_n_columns:
          n: 1
        has_n_lines:
          n: 320
        has_text:
          text: "Predicted"
    'Evaluation metrics (validation set)':
      asserts:
        has_n_columns:
          n: 5
        has_n_lines:
          n: 2
        has_text:
          text: "f1_macro"
    'Predicted label probabilities (test set)':
      asserts:
        has_n_columns:
          n: 3
        has_n_lines:
          n: 320
    'Confusion matrix (test set)':
      asserts:
        has_image_width:
          width: 875
        has_image_height:
          height: 875

