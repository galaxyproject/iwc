- doc: Test outline for Split-BAM-by-Path
  job:
    Input Path List:
      class: File
      location: https://zenodo.org/records/21993237/files/Input_path_list.txt?download=1
      filetype: txt
    Input BAM:
      class: File
      location: https://zenodo.org/records/21993237/files/BAM.bam?download=1
      filetype: bam
  outputs:
    Output Paths:
      element_tests:
        contig_for_bam_000000.txt:
          asserts:
            - that: "has_line"
              line: "chr1"
              n: 1
            - that: "has_n_lines"
              n: 1
        contig_for_bam_000001.txt:
          asserts:
            - that: "has_line"
              line: "chr2"
              n: 1
            - that: "has_n_lines"
              n: 1
    Output BAMs:
      element_tests:
        contig_for_bam_000000.txt:
          element_test:
            has_size: 58636
            delta: 2000
        contig_for_bam_000001.txt:
          element_test:
            has_size: 59576
            delta: 2000
