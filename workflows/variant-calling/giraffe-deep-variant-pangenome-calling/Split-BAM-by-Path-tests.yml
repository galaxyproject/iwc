- doc: Test outline for Split-BAM-by-Path
  job:
    Input path list:
      class: File
      path: test-data/Input_path_list.txt
      filetype: txt
    Input BAM:
      class: File
      path: test-data/BAM.bam
      filetype: bam
  outputs:
    list_output_txt:
      element_tests:
        contig_for_bam_000000.txt:
          asserts:
            - that: "has_line"
              line: "chr1"
              n: 1
            - that: "has_n_lines"
              n: 1
        contig_for_bam_000001.txt:
          asserts:
            - that: "has_line"
              line: "chr2"
              n: 1
            - that: "has_n_lines"
              n: 1
    Output BAM:
      element_tests:
        contig_for_bam_000000.txt:
          element_test:
            has_size: 58636
            delta: 2000
        contig_for_bam_000001.txt:
          element_test:
            has_size: 59576
            delta: 2000
