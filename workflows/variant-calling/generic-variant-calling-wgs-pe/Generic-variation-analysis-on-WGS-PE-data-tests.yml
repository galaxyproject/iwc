- doc: Test outline for Generic-variation-analysis-on-WGS-PE-data
  job:
    GenBank genome:
      class: File
      filetype: genbank
      path: test-data/GenBank genome.genbank
      hashes:
      - hash_function: SHA-1
        hash_value: 586d54741cb8b8f7d2e473827d3b25e5a235f9f7
    Name for genome database: mpxv
    Paired Collection:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        type: paired
        identifier: ERR3485802
        elements:
        - identifier: forward
          class: File
          path: test-data/ERR3485802.forward.fastq.gz
          hashes:
          - hash_function: SHA-1
            hash_value: 00db6798ebbb520c28bc4d0e52c0fabac0bb37ac
        - identifier: reverse
          class: File
          path: test-data/ERR3485802.reverse.fastq.gz
          hashes:
          - hash_function: SHA-1
            hash_value: 9a9f61098507023fab3e1fa0383ca628759108c1
  outputs:
    Fasta sequences for genbank file:
      path: test-data/Fasta sequences for genbank file.fasta
      compare: contains
    SnpEff variants:
      element_tests:
        ERR3485802:
          asserts:
            - has_line:
                line: "#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO"
            - has_text:
                text: '##SnpEffVersion='
            # SnpEff must find the chromosome in the database built from the GenBank file
            - not_has_text:
                text: ERROR_CHROMOSOME_NOT_FOUND
            # 92 variant records (90 PASS, 2 sb_fdr), 54 of them annotated, with the reference tool versions
            - has_line_matching:
                expression: 'KP849471(\.1)?\t.*'
                n: 92
                delta: 5
            - has_line_matching:
                expression: 'KP849471(\.1)?\t([^\t]+\t){5}PASS\t.*'
                n: 90
                delta: 5
            - has_line_matching:
                expression: 'KP849471(\.1)?\t([^\t]+\t){5}sb_fdr\t.*'
                n: 2
                delta: 2
            - has_line_matching:
                expression: 'KP849471(\.1)?\t.*;EFF=[A-Z_+]+\((HIGH|MODERATE|LOW|MODIFIER)\|.*'
                n: 54
                delta: 6
            - has_line_matching:
                expression: 'KP849471(\.1)?\t14383\t\.\tT\tC\t[0-9.]+\tPASS\t.*EFF=NON_SYNONYMOUS_CODING\(MODERATE\|MISSENSE\|Aaa/Gaa\|K393E\|.*'
            - has_line_matching:
                expression: 'KP849471(\.1)?\t30663\t\.\tC\tT\t[0-9.]+\tPASS\t.*EFF=SYNONYMOUS_CODING\(LOW\|SILENT\|acC/acT\|T101\|.*'
            - has_line_matching:
                expression: 'KP849471(\.1)?\t177387\t\.\tG\tT\t[0-9.]+\tPASS\t.*EFF=NON_SYNONYMOUS_CODING\(MODERATE\|MISSENSE\|Gac/Tac\|D627Y\|.*'
            - has_line_matching:
                expression: 'KP849471(\.1)?\t190964\t\.\tC\tT\t[0-9.]+\tPASS\t.*EFF=NON_SYNONYMOUS_CODING\(MODERATE\|MISSENSE\|gCa/gTa\|A4V\|.*'
            - has_line_matching:
                expression: 'KP849471(\.1)?\t190951\t\.\tG\tA\t[0-9.]+\tsb_fdr\t.*'
    called_variants:
      element_tests:
        ERR3485802:
          asserts:
            - has_line:
                line: "#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO"
            # 92 variant records (17 indels), all PASS before soft filtering
            - has_line_matching:
                expression: 'KP849471(\.1)?\t.*'
                n: 92
                delta: 5
            - has_line_matching:
                expression: 'KP849471(\.1)?\t.*;INDEL;.*'
                n: 17
                delta: 3
            - has_line_matching:
                expression: 'KP849471(\.1)?\t8226\t\.\tG\tA\t[0-9.]+\tPASS\tDP=5;AF=1(\.0+)?;SB=0;DP4=0,0,4,1'
            - has_line_matching:
                expression: 'KP849471(\.1)?\t93756\t\.\tTAAATGG\tT\t[0-9.]+\tPASS\t.*INDEL;.*'
            - has_line_matching:
                expression: 'KP849471(\.1)?\t190951\t\.\tG\tA\t[0-9.]+\tPASS\t.*'
    mapped_reads_stats:
      element_tests:
        ERR3485802:
          asserts:
            - has_text:
                text: This file was produced by samtools stats
            - has_line_matching:
                expression: 'SN\traw total sequences:\t4626(\t.*)?'
            - has_line:
                line: "SN\treads mapped:\t4626"
            - has_line_matching:
                expression: 'SN\treads properly paired:\t4626(\t.*)?'
            - has_line_matching:
                expression: 'SN\treads duplicated:\t0(\t.*)?'
            - has_line:
                line: "SN\taverage length:\t150"
    soft_filtered_variants:
      element_tests:
        ERR3485802:
          asserts:
            - has_line:
                line: "#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO"
            # 92 variant records (90 PASS, 2 sb_fdr)
            - has_line_matching:
                expression: 'KP849471(\.1)?\t.*'
                n: 92
                delta: 5
            - has_line_matching:
                expression: 'KP849471(\.1)?\t([^\t]+\t){5}sb_fdr\t.*'
                n: 2
                delta: 2
            - has_line_matching:
                expression: 'KP849471(\.1)?\t8226\t\.\tG\tA\t[0-9.]+\tPASS\tDP=5;AF=1(\.0+)?;SB=0;DP4=0,0,4,1'
            - has_line_matching:
                expression: 'KP849471(\.1)?\t153631\t\.\tG\tT\t[0-9.]+\tsb_fdr\t.*'
            - has_line_matching:
                expression: 'KP849471(\.1)?\t190951\t\.\tG\tA\t[0-9.]+\tsb_fdr\t.*'
