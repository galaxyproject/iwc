- doc: Test KMIndex/Logan SRA retrieval with query sequence
  job:
    Query Sequence:
      class: File
      path: test-data/query-sequence.fasta
      hashes:
      - hash_function: SHA-1
        hash_value: 69b9d3d941720ef225f5545a711e9ab8a209da49
    Index To Query: "VIRALRNA_ROD"
    Z-value (k-mer extension factor): 6
    Minimum shared k-mer proportion: 0.25
    How many accessions to keep: 1
  outputs:
    KMIndex/ Logan Matching Accessions List:
      asserts:
      - that: has_line_matching
        expression: "[ESD]RR[0-9]+"
        n: 1
    Paired End Reads:
      class: Collection
      count: 1
      element_tests: {}
    Single End Reads:
      class: Collection
      count: 0
      element_tests: {}
