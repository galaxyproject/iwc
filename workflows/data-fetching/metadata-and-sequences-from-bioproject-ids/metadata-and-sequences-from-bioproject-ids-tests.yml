- doc: Test 1 for Metadata and Sequences from BioProject IDs
  job:
    BioProject IDs:
      class: File
      path: test-data/test1_single_prj_pe.txt
      filetype: txt
    Include assay type in metadata: false
    Include sample attributes in metadata: false
    Display detailed metadata table: true
    Expand sample attributes in metadata: false
  outputs:
    SRA metadata table:
      class: Collection
      element_tests:
        PRJNA1417618:
          asserts:
            - that: has_n_lines
              n: 2
            - that: has_text
              text: "run_accession\tstudy_accession\tstudy_title\texperiment_accession\t"
            - that: has_line_matching
              expression: "^SRR37073390\\tSRP674006\\t[^\\t]*\\tSRX32019766\\t[^\\t]*\\t[^\\t]*\\t190065\\tFowl aviadenovirus E\\t[^\\t]*\\tWGS\\tGENOMIC\\t[^\\t]*\\tPAIRED\\t[^\\t]*\\t[^\\t]*\\tSAMN55001290\\tPRJNA1417618\\t.*"
    Paired End Reads:
      class: Collection
      element_tests:
        SRR37073390:
          forward:
            path: test-data/test1_paired_end_collection_forward.fastq
            decompress: true
            compare: contains
          reverse:
            path: test-data/test1_paired_end_collection_reverse.fastq
            decompress: true
            compare: contains

