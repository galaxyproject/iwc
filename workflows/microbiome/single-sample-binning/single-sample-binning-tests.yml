- doc: Test for single-sample-binning (Binette only)
  job:
    Paired-end reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        identifier: Mock1
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
        collection_type: paired
      - class: Collection
        identifier: Mock2
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
        collection_type: paired
      - class: Collection
        identifier: Mock3
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock3_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock3_R2.fastq.gz
        collection_type: paired
      - class: Collection
        identifier: Mock4
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock4_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock4_R2.fastq.gz
        collection_type: paired
      - class: Collection
        identifier: Mock5
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock5_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock5_R2.fastq.gz
        collection_type: paired
    Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
      - class: File
        identifier: Mock3
        location: https://zenodo.org/records/22982485/files/Mock3.fasta
      - class: File
        identifier: Mock4
        location: https://zenodo.org/records/22982485/files/Mock4.fasta
      - class: File
        identifier: Mock5
        location: https://zenodo.org/records/22982485/files/Mock5.fasta
    Run COMEBin?: 'No'
    Bin refinement tool: Binette
    CheckM2 Database: 1.0.2
    Minimum MAG completeness percentage: 40
    Contamination weight (Binette): 2
    Environment for the built-in model (SemiBin): global
  outputs:
    SemiBin bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
      class: Collection
    MetaBAT2 bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
      class: Collection
    MaxBin2 bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
      class: Collection
    CONCOCT bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
      class: Collection
    Binette bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
      class: Collection
    COMEBin bins:
      # COMEBin is disabled: preserve sample structure but emit no bins.
      element_tests:
        Mock4:
          class: Collection
          count: 0
        Mock5:
          class: Collection
          count: 0
      class: Collection
    Binette input bin quality reports:
      element_tests:
        Mock4:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
              - has_n_lines:
                  n: 9
                  delta: 2
        Mock5:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
              - has_n_lines:
                  n: 58
                  delta: 2
      class: Collection
    Binette final bin quality report:
      element_tests:
        Mock4:
          asserts:
          - has_n_lines:
              n: 4
              delta: 1
        Mock5:
          asserts:
          - has_n_lines:
              n: 5
              delta: 1
      class: Collection
    Coverage depth matrices:
      class: Collection
      element_tests:
        Mock1:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 5
        Mock2:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 5
        Mock3:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 5
        Mock4:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 5
        Mock5:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 5
