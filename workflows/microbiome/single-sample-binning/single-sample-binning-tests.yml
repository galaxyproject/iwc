- doc: Test for single-sample-binning (Binette only)
  job:
    Paired-end reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        type: paired
        identifier: Mock1
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock2
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock3
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock3_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock3_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock4
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock4_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock4_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock5
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock5_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock5_R2.fastq.gz
    Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
      - class: File
        identifier: Mock3
        location: https://zenodo.org/records/22982485/files/Mock3.fasta
      - class: File
        identifier: Mock4
        location: https://zenodo.org/records/22982485/files/Mock4.fasta
      - class: File
        identifier: Mock5
        location: https://zenodo.org/records/22982485/files/Mock5.fasta
    Run COMEBin?: true
    Read length (CONCOCT): 100
    Bin refinement tool: Binette
    CheckM2 Database: 1.0.2
  outputs:
    SemiBin bins:
      element_tests:
        Mock4:
          elements:
            SemiBin_0:
              asserts:
                - has_size:
                    value: 1500000
                    delta: 250000
        Mock5:
          elements:
            SemiBin_0:
              asserts:
                - has_size:
                    value: 1500000
                    delta: 250000
    MetaBAT2 bins:
      element_tests:
        Mock4:
          elements:
            '1':
              asserts:
                - has_size:
                    value: 1500000
                    delta: 250000
        Mock5:
          elements:
            '1':
              asserts:
                - has_size:
                    value: 568018
                    delta: 150000
    MaxBin2 bins:
      element_tests:
        Mock4:
          elements:
            '001':
              asserts:
                - has_size:
                    value: 1500000
                    delta: 250000
        Mock5:
          elements:
            '001':
              asserts:
                - has_size:
                    value: 1200000
                    delta: 250000
    CONCOCT bins:
      element_tests:
        Mock4:
          elements:
            '0':
              asserts:
                - has_size:
                    value: 112000
                    delta: 25000
        Mock5:
          elements:
            '0':
              asserts:
                - has_size:
                    value: 4000
                    delta: 1000
    Binette bins:
      element_tests:
        Mock4:
          elements:
            binette_bin1:
              asserts:
                - has_size:
                    value: 1500000
                    delta: 250000
        Mock5:
          elements:
            binette_bin1:
              asserts:
                - has_size:
                    value: 1500000
                    delta: 250000
    COMEBin bins:
      element_tests:
        Mock4:
          elements:
            405.fa:
              asserts:
                - has_size:
                    value: 584397
                    delta: 180000
        Mock5:
          elements:
            25.fa:
              asserts:
                - has_size:
                    value: 419209
                    delta: 150000
    Binette pre quality reports:
      element_tests:
        Mock4:
          elements:
            input_bins_1.bin_table_0:
              asserts:
                - has_n_lines:
                    n: 9
                    delta: 2
        Mock5:
          elements:
            input_bins_1.bin_table_0:
              asserts:
                - has_n_lines:
                    n: 58
                    delta: 2
    Binette post quality reports:
      element_tests:
        Mock4:
          asserts:
            - has_n_lines:
                n: 4
                delta: 1
        Mock5:
          asserts:
            - has_n_lines:
                n: 5
                delta: 1
