- doc: Test for Metagenome-Assembled-Genomes-(MAGs)-generation short read only
  job:
    Trimmed reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        collection_type: paired
        identifier: test_minigut
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/19235149/files/test_minigut_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/19235149/files/test_minigut_R2.fastq.gz
    Choose Assembler: MEGAHIT
    Custom Assemblies: null
    Minimum length of contigs to output: 100
    Environment for the built-in model (SemiBin): global
    Contamination weight (Binette): 100
    CheckM2 Database: 1.0.2
    Minimum MAG completeness percentage: 1
    Maximum MAG contamination percentage: 1
    Minimum MAG length: 100
    ANI threshold for dereplication: 0.99
    Run COMEBin: false
    Trimmed nanopore reads: null
    Trimmed PacBio reads: null
    Use grouping?: Use original samples
    Sample grouping column: group
    Binning strategy: Single-coverage binning (own/merged reads)
    Bin refinement tool: Binette
    Metadata: null
  outputs:
    Full MultiQC Report:
      asserts:
      - that: has_text
        text: QUAST
      - that: has_text
        text: CheckM
    Assembly Report:
      class: Collection
      element_tests:
        test_minigut:
          asserts:
          - that: has_text
            text: All statistics are based on contigs of size
          - that: has_size
            value: 373800
            delta: 50000
    Primary clustering dendrogram:
      asserts:
      - that: has_size
        value: 18360
        delta: 3000
    Cluster Assignment:
      asserts:
      - that: has_text
        text: genome
      - that: has_text
        text: primary_cluster
      - that: has_text
        text: test_minigut_binette_bin5
    Dereplicated Bins:
      class: Collection
      element_tests:
        test_minigut_binette_bin1.fasta:
          asserts:
          - that: has_size
            value: 758150
            delta: 15000
    Merged CoverM Output:
      asserts:
      - that: has_text
        text: Genome
      - that: has_text
        text: unmapped
    Merged Quast Output:
      asserts:
      - that: has_text
        text: Assembly
      - that: has_text
        text: test_minigut_binette_bin1.fasta
- doc: Test for Metagenome-Assembled-Genomes-(MAGs)-generation long read test
  job:
    Trimmed reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
