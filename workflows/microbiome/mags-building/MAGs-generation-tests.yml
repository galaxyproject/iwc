# Kept deliberately light so it fits on a GitHub runner. Assembly (MEGAHIT,
# metaSPAdes, long reads) and the binners/refiners are covered by the tests of
# the embedded Metagenomic Assembly, single-sample and multi-sample binning
# workflows. This test only covers what the parent adds: internal grouping,
# merging both coverage strategies and both refiners into one bin set, the
# CheckM2 filter before dRep, and the MAG quality/abundance reporting.
# Custom assemblies skip the assembler; MetaBAT2 is the only binner.
# Mock1 and Mock2 are near-identical communities, so Mock1.fasta also stands in
# for the MockGroup co-assembly.
- doc: "Hybrid grouped and original samples with custom assemblies, both coverage strategies and both refiners"
  job:
    Trimmed reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        identifier: Mock1
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
        collection_type: paired
      - class: Collection
        identifier: Mock2
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
        collection_type: paired
    Choose Assembler: Custom Assembly
    Custom Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: MockGroup
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
    Minimum length of contigs to output: 100
    Environment for the built-in model (SemiBin): global
    Contamination weight (Binette): 100
    CheckM2 Database: 1.0.2
    Minimum MAG completeness percentage: 1
    Maximum MAG contamination percentage: 1
    Minimum MAG length: 100
    ANI threshold for dereplication: 0.99
    Run COMEBin?: false
    Run SemiBin?: false
    Run CONCOCT?: false
    Run MetaBAT2?: true
    Run MaxBin2?: false
    Trimmed nanopore reads: null
    Trimmed PacBio reads: null
    Use grouping?: Use grouping and original samples
    Sample grouping column: group
    Binning strategy: Both
    Bin refinement tool: Both
    Metadata:
      class: File
      path: test-data/metadata_mock_community_mocks.tsv
      filetype: tabular
  outputs:
    "Single-coverage binning (own/merged reads) — coverage depths":
      class: Collection
      element_tests:
        MockGroup:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 5
        Mock1:
          asserts:
          - that: has_n_columns
            n: 5
        Mock2:
          asserts:
          - that: has_n_columns
            n: 5
    # multi coverage maps both original samples to every assembly: 3 + 2x2 columns
    "Multi-coverage binning (all samples) — coverage depths":
      class: Collection
      element_tests:
        MockGroup:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 7
        Mock1:
          asserts:
          - that: has_n_columns
            n: 7
        Mock2:
          asserts:
          - that: has_n_columns
            n: 7
    # The top-ranked Binette bin exists in both coverage strategies whenever
    # binning succeeds, so it is always suffixed _1 and _2. Which other bins
    # appear in one or both strategies varies between runs, as does dRep's
    # choice of cluster representative.
    Merged refined bins (all branches):
      class: Collection
      element_tests:
        "MockGroup:binette_bin1_1":
          asserts:
          - that: has_text
            text: ">"
        "MockGroup:binette_bin1_2":
          asserts:
          - that: has_text
            text: ">"
    Cluster Assignment:
      asserts:
      - that: has_text
        text: primary_cluster
      - that: has_text
        text: binette_bin
    Merged CoverM Output:
      asserts:
      - that: has_text
        text: Genome
      - that: has_text
        text: unmapped
    Full MultiQC Report:
      asserts:
      - that: has_text
        text: QUAST
      - that: has_text
        text: CheckM
