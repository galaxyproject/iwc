    Choose Assembler: metaSPAdes
    Custom Assemblies: null
    Minimum length of contigs to output: 100
    Environment for the built-in model (SemiBin): global
    Contamination weight (Binette): 100
    CheckM2 Database: 1.0.2
    Minimum MAG completeness percentage: 1
    Maximum MAG contamination percentage: 1
    Minimum MAG length: 100
    ANI threshold for dereplication: 0.99
    Run COMEBin: false
    Trimmed nanopore reads:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: minigut_reads
        location: https://zenodo.org/records/19235149/files/minigut_reads.fastq.gz
    Trimmed PacBio reads: null
    Use grouping?: Use original samples
    Sample grouping column: group
    Binning strategy: Single-coverage binning (own/merged reads)
    Bin refinement tool: Binette
    Metadata: null
  outputs:
    Full MultiQC Report:
      asserts:
      - that: has_text
        text: minigut_reads_binette_bin1_fasta
      - that: has_text
        text: QUAST
      - that: has_text
        text: CheckM
    Assembly Report:
      class: Collection
      element_tests:
        minigut_reads:
          asserts:
          - that: has_text
            text: All statistics are based on contigs of size
          - that: has_size
            value: 361400
            delta: 50000
    metaSPAdes Contigs:
      class: Collection
      element_tests:
        minigut_reads:
          asserts:
          - that: has_size
            value: 1736000
            delta: 200000
    Primary clustering dendrogram:
      asserts:
      - that: has_size
        value: 13380
        delta: 2000
    Cluster Assignment:
      asserts:
      - that: has_text
        text: genome
      - that: has_text
        text: primary_cluster
      - that: has_text
        text: minigut_reads_binette_bin2.fasta
    Dereplicated Bins:
      class: Collection
      element_tests:
        minigut_reads_binette_bin1.fasta:
          asserts:
          - that: has_size
            value: 867521
            delta: 10000
    Merged CoverM Output:
      asserts:
      - that: has_text
        text: Genome
      - that: has_text
        text: unmapped
      - that: has_text
        text: minigut_reads_binette_bin2
    Merged Quast Output:
      asserts:
      - that: has_text
        text: Assembly
      - that: has_text
        text: '4'
      - that: has_text
        text: minigut_reads_binette_bin2.fasta
