- doc: MEGAHIT ignores long reads with unrelated identifiers and different group counts
  job:
    Trimmed paired reads from grouped samples:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        collection_type: paired
        identifier: test_minigut
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/19235149/files/test_minigut_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/19235149/files/test_minigut_R2.fastq.gz
    Trimmed nanopore reads from grouped samples:
      collection_type: list
      elements:
      - identifier: unrelated_nanopore
        class: File
        path: test-data/unused-long-reads.fastq
        filetype: fastqsanger
      class: Collection
    Trimmed PacBio reads from grouped samples:
      collection_type: list
      elements:
      - identifier: unrelated_pacbio_1
        class: File
        path: test-data/unused-long-reads.fastq
        filetype: fastqsanger
      - identifier: unrelated_pacbio_2
        class: File
        path: test-data/unused-long-reads.fastq
        filetype: fastqsanger
      class: Collection
    Choose Assembler: MEGAHIT
    Custom Assemblies: null
    Minimum length of contigs to output: 100
  outputs:
    Quast HTML report:
      class: Collection
      element_tests:
        test_minigut:
          asserts:
          - has_size:
              value: 382796
              delta: 20000
    Quast report:
      class: Collection
      element_tests:
        test_minigut:
          asserts:
          - has_n_lines:
              n: 22
              delta: 5
    Final assemblies:
      class: Collection
      element_tests:
        test_minigut:
          asserts:
          - has_text:
              text: '>'
          - has_size:
              value: 1827686
              delta: 250000
