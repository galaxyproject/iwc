- doc: Test for multi-sample-binning (Both)
  job:
    Paired-end reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        identifier: Mock1
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
        collection_type: paired
      - class: Collection
        identifier: Mock2
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
        collection_type: paired
    Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
    Run COMEBin?: 'No'
    Bin refinement tool: Both
    CheckM2 Database: 1.0.2
    Minimum MAG completeness percentage: 40
    Contamination weight (Binette): 2
  outputs:
    SemiBin bins:
      element_tests:
        Mock1:
          class: Collection
          min: 1
        Mock2:
          class: Collection
          min: 1
      class: Collection
    MetaBAT2 bins:
      element_tests:
        Mock1:
          class: Collection
          min: 1
        Mock2:
          class: Collection
          min: 1
      class: Collection
    MaxBin2 bins:
      element_tests:
        Mock1:
          class: Collection
          min: 1
        Mock2:
          class: Collection
          min: 1
      class: Collection
    CONCOCT bins:
      element_tests:
        Mock1:
          class: Collection
          min: 1
        Mock2:
          class: Collection
          min: 1
      class: Collection
    COMEBin bins:
      # COMEBin is disabled: preserve sample structure but emit no bins.
      element_tests:
        Mock1:
          class: Collection
          count: 0
        Mock2:
          class: Collection
          count: 0
      class: Collection
    Binette bins:
      element_tests:
        Mock1:
          class: Collection
          min: 1
        Mock2:
          class: Collection
          min: 1
      class: Collection
    DAS Tool bins:
      element_tests:
        Mock1:
          class: Collection
          min: 1
        Mock2:
          class: Collection
          min: 1
      class: Collection
    Binette input bin quality reports:
      element_tests:
        Mock1:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
              - has_text:
                  text: completeness
              - has_n_lines:
                  min: 2
        Mock2:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
              - has_text:
                  text: completeness
              - has_n_lines:
                  min: 2
      class: Collection
    Binette final bin quality report:
      element_tests:
        Mock1:
          asserts:
          - has_text:
              text: completeness
          - has_n_lines:
              min: 2
        Mock2:
          asserts:
          - has_text:
              text: completeness
          - has_n_lines:
              min: 2
      class: Collection
    DAS Tool summary:
      element_tests:
        Mock1:
          asserts:
          - has_text:
              text: SCG_completeness
          - has_n_lines:
              min: 2
        Mock2:
          asserts:
          - has_text:
              text: SCG_completeness
          - has_n_lines:
              min: 2
      class: Collection
    DAS Tool contigs2bin report:
      element_tests:
        Mock1:
          asserts:
          - has_n_lines:
              min: 100
          - has_line_matching:
              expression: ^\S+\t\S+$
        Mock2:
          asserts:
          - has_n_lines:
              min: 100
          - has_line_matching:
              expression: ^\S+\t\S+$
      class: Collection
    Coverage depth matrices:
      class: Collection
      element_tests:
        Mock1:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 7
        Mock2:
          asserts:
          - that: has_text
            text: contigName
          - that: has_n_columns
            n: 7
