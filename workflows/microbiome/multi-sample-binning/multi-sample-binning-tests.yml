- doc: Test for multi-sample-binning (Both)
  job:
    Paired-end reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        type: paired
        identifier: Mock1
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock2
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock3
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock3_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock3_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock4
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock4_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock4_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock5
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock5_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock5_R2.fastq.gz
    Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
      - class: File
        identifier: Mock3
        location: https://zenodo.org/records/22982485/files/Mock3.fasta
      - class: File
        identifier: Mock4
        location: https://zenodo.org/records/22982485/files/Mock4.fasta
      - class: File
        identifier: Mock5
        location: https://zenodo.org/records/22982485/files/Mock5.fasta
    Run COMEBin?: true
    Read length (CONCOCT): 100
    Bin refinement tool: Both
    CheckM2 Database: 1.0.2
  outputs:
    SemiBin bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    MetaBAT2 bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    MaxBin2 bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    CONCOCT bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    COMEBin bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    Binette bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    DAS Tool bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    Binette input bin quality reports:
      element_tests:
        Mock4:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
                - has_text:
                    text: completeness
                - has_n_lines:
                    min: 2
        Mock5:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
                - has_text:
                    text: completeness
                - has_n_lines:
                    min: 2
    Binette final bin quality report:
      element_tests:
        Mock4:
          asserts:
            - has_text:
                text: completeness
            - has_n_lines:
                min: 2
        Mock5:
          asserts:
            - has_text:
                text: completeness
            - has_n_lines:
                min: 2
    DAS Tool summary:
      element_tests:
        Mock4:
          asserts:
            - has_text:
                text: SCG_completeness
            - has_n_lines:
                min: 2
        Mock5:
          asserts:
            - has_text:
                text: SCG_completeness
            - has_n_lines:
                min: 2
    DAS Tool contigs2bin report:
      element_tests:
        Mock4:
          asserts:
            - has_n_lines:
                min: 100
            - has_line_matching:
                expression: '^\S+\t\S+$'
        Mock5:
          asserts:
            - has_n_lines:
                min: 100
            - has_line_matching:
                expression: '^\S+\t\S+$'
