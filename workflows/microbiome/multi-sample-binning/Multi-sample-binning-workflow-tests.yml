- doc: Test for Multi-sample-binning-workflow
  job:
    Read:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        type: paired
        identifier: ERR486835
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22922544/files/ERR486835_forward.fastqsanger.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22922544/files/ERR486835_reverse.fastqsanger.gz
      - class: Collection
