# Kept deliberately light so it fits on a GitHub runner. Assembly, the
# individual binners and refiners, the long-read branch and the annotation
# tools are covered by the tests of the embedded standalone workflows. This
# case covers what the end-to-end workflow adds: short-read QC and host removal
# feeding MAG generation, the empty long-read fallbacks when no long reads are
# given, and passing the dereplicated MAGs to an annotation workflow.
# Custom assemblies skip the assembler; MetaBAT2 is the only binner. Mock1 and
# Mock2 yield near-identical bins and the dRep representative varies between
# runs, so no dereplicated MAG identifier is asserted.
- doc: "Short reads only, custom assemblies, MetaBAT2 + Binette, dereplication and genome annotation with Bakta and ToolDistillator disabled"
  job:
    Paired-end short reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        identifier: Mock1
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
          hashes:
          - hash_function: MD5
            hash_value: 88eeb5f25232df64bf01bccb94743a68
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
          hashes:
          - hash_function: MD5
            hash_value: 69e8415025d686ce83169eed749f9a2b
        collection_type: paired
      - class: Collection
        identifier: Mock2
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
          hashes:
          - hash_function: MD5
            hash_value: edf0441910cdc60f298572685984261e
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
          hashes:
          - hash_function: MD5
            hash_value: 1e7ba2a826bc08cfb6c8e7d0579a34a9
        collection_type: paired
    Long reads provided?: 'No'
    Choose Reference Genome: Use a built-in genome index
    Host or contaminant genome (short reads): apiMel3
    Choose Assembler: Custom Assembly
    Custom assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
        hashes:
        - hash_function: MD5
          hash_value: 7862bfe58556a337763cdd8d157ba0e8
      - class: File
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
        hashes:
        - hash_function: MD5
          hash_value: 721fc961fc5bf3958e990463cba036f1
    Minimum length of contigs to output: 100
    Environment for the built-in model (SemiBin): global
    Contamination weight (Binette): 100
    CheckM2 Database: 1.0.2
    Minimum MAG completeness percentage: 1
    Maximum MAG contamination percentage: 1
    Minimum MAG length: 100
    ANI threshold for dereplication: 0.99
    Run COMEBin?: false
    Run SemiBin?: false
    Run CONCOCT?: false
    Run MetaBAT2?: true
    Run MaxBin2?: false
    Binning strategy: Single-coverage binning (own/merged reads)
    Bin refinement tool: Binette
    Use grouping?: Use original samples
    # The database names and the long-read host genome only fill required text
    # inputs of optional branches; those branches stay disabled in this test.
    Host or contaminant genome (long reads): apiMel3
    GTDB-Tk Database: full_database_release_220_downloaded_2024-10-19
    kMetaShot Database: '2025-05-22'
    Plasmid detection database: plasmidfinder_1307168_2019_08_28
    Bacterial genome annotation database: V5.0_2023-02-20
    AMRFinderPlus database: amrfinderplus_V3.12_2024-05-02.2
    Run taxonomy annotation?: 'No'
    Run genome annotation?: 'Yes'
    Run Bakta: false
    Run functional annotation?: 'No'
  outputs:
    Short-read QC report:
      asserts:
      - that: has_text
        text: "fastp"
    Short-read host removal report:
      asserts:
      - that: has_text
        text: "Bowtie 2"
    Assembly quality report:
      class: Collection
      element_tests:
        Mock1:
          asserts:
          - that: has_text
            text: "QUAST"
        Mock2:
          asserts:
          - that: has_text
            text: "QUAST"
    MAG assembly quality table:
      asserts:
      - that: has_text
        text: "Assembly"
      - that: has_text
        text: "binette_bin"
    MAG abundance table:
      asserts:
      - that: has_text
        text: "Genome"
      - that: has_text
        text: "binette_bin"
    MAG quality and abundance report:
      asserts:
      - that: has_text
        text: "CheckM2"
    Genome annotation report:
      asserts:
      - that: has_text
        text: "MultiQC"
    Plasmid detection summary:
      asserts:
      - that: has_text
        text: "Sample\tDatabase\tPlasmid\tIdentity"
