- doc: "Short-read MAG generation: assembly, single-coverage binning, refinement and dereplication. The optional long-read and annotation branches stay disabled here; the annotation subworkflows are tested in their own published workflows."
  job:
    Paired-end short reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        identifier: Mock1
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
        collection_type: paired
      - class: Collection
        identifier: Mock2
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
        collection_type: paired
    Long reads provided?: 'No'
    Choose Reference Genome: Use a built-in genome index
    Host or contaminant genome (short reads): apiMel3
    Choose Assembler: MEGAHIT
    Minimum length of contigs to output: 100
    Environment for the built-in model (SemiBin): global
    Contamination weight (Binette): 100
    CheckM2 Database: 1.0.2
    Minimum MAG completeness percentage: 1
    Maximum MAG contamination percentage: 1
    Minimum MAG length: 100
    ANI threshold for dereplication: 0.99
    Run COMEBin?: false
    Run SemiBin?: false
    Run CONCOCT?: false
    Run MetaBAT2?: true
    Run MaxBin2?: true
    Binning strategy: Single-coverage binning (own/merged reads)
    Bin refinement tool: Binette
    Use grouping?: Use original samples
    # The database names and the long-read host genome only fill required text
    # inputs of optional branches; those branches stay disabled in this test.
    Host or contaminant genome (long reads): apiMel3
    GTDB-Tk Database: full_database_release_220_downloaded_2024-10-19
    kMetaShot Database: '2025-05-22'
    Plasmid detection database: plasmidfinder_1307168_2019_08_28
    Bacterial genome annotation database: V5.0_2023-02-20
    AMRFinderPlus database: amrfinderplus_V3.12_2024-05-02.2
    Run taxonomy annotation?: 'No'
    Run genome annotation?: 'No'
    Run functional annotation?: 'No'
  outputs:
    Short-read QC report:
      asserts:
      - that: has_text
        text: "fastp"
    Short-read host removal report:
      asserts:
      - that: has_text
        text: "Bowtie 2"
    Assembly quality report:
      class: Collection
      element_tests:
        Mock1:
          asserts:
          - that: has_text
            text: "QUAST"
        Mock2:
          asserts:
          - that: has_text
            text: "QUAST"
    MAG assembly quality table:
      asserts:
      - that: has_text
        text: "Assembly"
    MAG abundance table:
      asserts:
      - that: has_text
        text: "Genome"
    MAG quality and abundance report:
      asserts:
      - that: has_text
        text: "CheckM2"
