fe3-fc04a59ec95c&quot;],&quot;version&quot;:[0,4]}],&quot;workflow_job_input&quot;:[0,{&quot;input table&quot;:[0,{&quot;class&quot;:[0,&quot;File&quot;],&quot;path&quot;:[0,&quot;todo_test_data_path.ext&quot;]}]}],&quot;readme&quot;:[0,&quot;# Filter a tabular file with top variance features\n\nYou can use this workflow to keep the highly variable features in your data.\nFor example you have a matrix of RNA expression with 10000 genes and you want to keep n number of genes that have the most variance among your samples.\nThis workflow will calculate the variance of each gene among the samples, then sorts the genes by the variance and cuts the selected n number of genes.\n\n## Inputs\n\nThe workflow needs the following inputs:\n- **The tabular file:**\n    - A tabular file with first column the feature names and first row the sample names. The header row is required.\n    - For example:\n\n    |gene\t|Sample1|Sample2|Sample3|\n    |-------|-------|-------|-------|\n    |gene1\t|8.99\t|9.34\t|9.79   |\n    |gene2\t|5.94\t|6.45\t|6.08   |\n    |gene3\t|6.38\t|5.67\t|6.53   |\n    |gene4\t|9.63\t|8.80\t|6.85   |\n\n- **Number of top features:**\n    - an integer parameter indicating the number of highly variable features to return.\n\n## Processing\n\n- The workflow calculates the variance of each feature, sorts the table by the variance and then selects the top n features.\n- For example from the matrix above we want to have the expression matrix of top 2 highly variable genes:\n    - Calculate variance per row:\n\n    |gene\t|Sample1|Sample2|Sample3|variance|\n    |-------|-------|-------|-------|--------|\n    |gene1\t|8.99\t|9.34\t|9.79   |0.161   |\n    |gene2\t|5.94\t|6.45\t|6.08   |0.069   |\n    |gene3\t|6.38\t|5.67\t|6.53   |0.211   |\n    |gene4\t|9.63\t|8.80\t|6.85   |2.037   |\n\n    - Sort by variance:\n\n    |gene\t|Sample1|Sample2|Sample3|variance|\n    |-------|-------|-------|-------|--------|\n    |gene4\t|9.63\t|8.80\t|6.85   |2.037   |\n    |gene3\t|6.38\t|5.67\t|6.53   |0.211   |\n    |gene1\t|8.99\t|9.34\t|9.79   |0.161   |\n    |gene2\t|5.94\t|6.45\t|6.08   |0.069   |\n\n    - Return top 2 highly variable genes:\n\n    |gene\t|Sample1|Sample2|Sample3|\n    |-------|-------|-------|-------|\n    |gene4\t|9.63\t|8.80\t|6.85   |\n    |gene3\t|6.38\t|5.67\t|6.53   |\n\n## Outputs\n\n- **Filtered matrix of highly variable features:**\n    - The input matrix restricted to the top n features with the highest variance across samples, sorted by decreasing variance and keeping the header row.\n\n## Contribution\n\n@nilchia wrote the workflow and the tests.\n&quot;],&quot;changelog&quot;:[0,&quot;# Changelog\n\nAll notable changes to this workflow will be documented in this file.\n\n\n## [0.1] - 2026-10-18\n\n### Added\n\n- Initial version.\n&quot;],&quot;diagrams&quot;:[0,&quot;# Workflow diagrams\n\n## filter a matrix by highly variable features\n\n```mermaid\ngraph LR\n0[\&quot;ℹ️ input table\&quot;]@{ shape: doc }\n1[\&quot;ℹ️ number of features to keep\&quot;]@{ shape: lean-l }\n2[\&quot;calculate variance\&quot;]@{ shape: process }\n0 --&gt; 2\n3[\&quot;add variance to the matrix\&quot;]@{ shape: process }\n2 --&gt; 3\n0 --&gt; 3\n4[\&quot;sort the matrix by variance\&quot;]@{ shape: process }\n3 --&gt; 4\n5[\&quot;select top n highly variable features\&quot;]@{ shape: process }\n4 --&gt; 5\n1 --&gt; 5\n6[\&quot;cut the first two columns\&quot;]@{ shape: process }\n5 --&gt; 6\n```\n&quot;],&quot;diagram_svg&quot;:[0,null],&quot;updated&quot;:[0,&quot;2026-10-18T00:00:00&quot;],&quot;trsID&quot;:[0,&quot;#workflow/github.com/iwc-workflows/filter-matrix-by-highly-variable-features/main&quot;],&quot;iwcID&quot;:[0,&quot;filter-matrix-by-highly-variable-features-main&quot;],&quot;repoPath&quot;:[0,&quot;./workflows/text-manipulation/filter-matrix-by-highly-variable-features&quot;],&quot;dockstore_id&quot;:[0,39224],&quot;categories&quot;:[1,[[0,&quot;Feature selection&quot;],[0,&quot;Data mining&quot;],[0,&quot;Gene
