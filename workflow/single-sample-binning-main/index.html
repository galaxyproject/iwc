:[0,&quot;quality&quot;],&quot;uuid&quot;:[0,&quot;eacc6f73-7d8f-477a-9027-3632aaa7ee27&quot;]}],[0,{&quot;label&quot;:[0,&quot;Binette bins&quot;],&quot;output_name&quot;:[0,&quot;bins&quot;],&quot;uuid&quot;:[0,&quot;f349ecdf-2aef-41b9-9a6f-9985450fb93b&quot;]}],[0,{&quot;label&quot;:[0,&quot;Binette final bin quality report&quot;],&quot;output_name&quot;:[0,&quot;final&quot;],&quot;uuid&quot;:[0,&quot;37af6411-26ee-4ded-b7e3-b30be7ab147b&quot;]}]]]}]}],&quot;tags&quot;:[1,[]],&quot;uuid&quot;:[0,&quot;0d3f0f2f-537d-4142-9221-f64ea62ce7f4&quot;],&quot;version&quot;:[0,1]}],&quot;workflow_job_input&quot;:[0,{&quot;Paired-end reads&quot;:[0,{&quot;class&quot;:[0,&quot;Collection&quot;],&quot;collection_type&quot;:[0,&quot;list&quot;],&quot;elements&quot;:[1,[[0,{&quot;class&quot;:[0,&quot;File&quot;],&quot;identifier&quot;:[0,&quot;todo_element_name&quot;],&quot;path&quot;:[0,&quot;todo_test_data_path.ext&quot;]}]]]}],&quot;Assemblies&quot;:[0,{&quot;class&quot;:[0,&quot;Collection&quot;],&quot;collection_type&quot;:[0,&quot;list&quot;],&quot;elements&quot;:[1,[[0,{&quot;class&quot;:[0,&quot;File&quot;],&quot;identifier&quot;:[0,&quot;todo_element_name&quot;],&quot;path&quot;:[0,&quot;todo_test_data_path.ext&quot;]}]]]}],&quot;Bin refinement tool&quot;:[0,&quot;todo_param_value&quot;],&quot;CheckM2 Database&quot;:[0,&quot;todo_param_value&quot;]}],&quot;readme&quot;:[0,&quot;# Single-sample binning workflow\n\nThis workflow uses paired-end reads and their corresponding assemblies, generated by any assembler, to produce metagenomic bins using multiple binning tools. Each binner uses a different approach to identify and group contigs into bins.\n\nAfter binning is complete, the workflow uses one or both of the available refinement tools to combine and refine the results from the individual binners, with the goal of generating higher-quality bins.\n\nIn contrast to the [multi-sample binning workflow](../multi-sample-binning/), which maps the reads of every sample against the assemblies of all samples to obtain cross-sample coverage, this workflow maps each sample&#39;s reads only against its own assembly. Single-sample binning therefore needs far fewer mapping jobs and much less storage, especially for many samples, but usually produces somewhat worse bins, because the binners cannot use abundance patterns across samples. Prefer multi-sample binning when resources allow and the samples come from related environments; use single-sample binning for large numbers of samples, unrelated samples, or limited storage.\n\nThis workflow is the binning section of the [MAGs generation workflow](../mags-building/), extracted so that MAGs generation and other workflows can reuse it instead of maintaining their own copy.\n\n## Inputs\n\n- **Paired-end reads**: a `list:paired` collection with one element per sample.\n  - Reads should be quality-trimmed and host-removed, e.g. with the IWC [short-read quality control](../../read-preprocessing/short-read-qc-trimming/) and [host contamination removal](../host-contamination-removal/host-contamination-removal-short-reads/) workflows.\n  - The sample names are used as coverage columns for the binners.\n- **Assemblies**: a `list` collection of assemblies from any assembler (e.g. MEGAHIT or metaSPAdes).\n  - Every sample&#39;s reads are mapped against their corresponding assembly. The two collections are paired by position, not by element identifier, so they must have the same number of elements, in the same order (e.g. sorted the same way).\n- **Run COMEBin?** (default: yes): COMEBin is a deep-learning binner that often improves the results, but it is the most time- and resource-consuming step of the workflow.\n- **Read length (CONCOCT)** (default: 100): the mean read length, required by CONCOCT to calculate contig coverage from the mapped reads. It can be estimated with FastQC.\n- **Bin refinement tool**: `DAS Tool`, `Binette` or `Both`.\n- **CheckM2 Database**: the CheckM2 reference database Binette uses to assess bin quality.\n\n## Outputs\n\n- **CONCOCT bins**, **MaxBin2 bins**, **MetaBAT2 bins**, **SemiBin bins** and **COMEBin bins** (if COMEBin was run): one list of bins per assembly.\n- **DAS Tool bins**, **DAS Tool summary** and **DAS Tool contigs2bin report** (if DAS Tool was run): the refined bins, a per-bin summary (completeness and redundancy based on single-copy genes) and the contig-to-bin assignments.\n- **Binette bins**, **Binette input bin quality reports** and **Binette final bin quality report** (if Binette was run): the refined bins, the CheckM2 quality of the bins from each binner, and the CheckM2 quality of the final bins.\n\n## Why use this workflow\n\nThis workflow provides a standardized and modular workflow for metagenomic binning that can be integrated into larger metagenomic analysis workflows. Its main purpose is to separate the binning step from other parts of MAG analysis, making complex workflows easier to understand, maintain, and adapt.\n\nUsing binning as an independent workflow provides better control over the inputs, binning parameters, and outputs. It also allows users to reuse the same binning strategy in different analysis pipelines without having to include unnecessary upstream or downstream steps. This modular design is particularly useful when the generated bins are intended for a specific downstream analysis, such as taxonomic classification, genome annotation, functional analysis, or benchmarking.\n\nIn contrast, the IWC Metagenome-Assembled Genomes (MAGs) generation workflow (https://iwc.galaxyproject.org/workflow/mags-building-main/) is designed as a comprehensive end-to-end solution. It performs metagenome assembly and multi-tool binning of paired short reads and optional long reads, followed by dereplication and analysis of MAG quality and abundance. This makes it well suited for users who want to generate and evaluate MAGs without requiring a specialized downstream workflow.(check [FAIRyMAGs repository](https://github.com/usegalaxy-eu/FAIRyMAGs) for the complete workflow suite and its capabilities).\nA dedicated [learning pathway](https://galaxyproject.github.io/training-material/learning-pathways/mags.html) provides detailed guidance on MAG generation in Galaxy, including the binning tools used here.\n\nThe standard binning workflow should therefore be preferred when binning needs to be incorporated as one component of a larger or more specialized analysis. It reduces workflow complexity, improves the overview of individual analysis steps, and makes it easier to modify or replace downstream analyses independently.\n\nWhen this workflow is used as a subworkflow, the parent workflow can restrict its options, for example by fixing the **Bin refinement tool** parameter so that users can only run one specific refinement tool.\n\n## Workflow logic\n\n- Preprocess reads and assembly/assemblies for binning.\n- Perform binning using multiple binners:\n\n  - CONCOCT\n  - MaxBin2\n  - MetaBAT2\n  - SemiBin\n  - COMEBin\n\n- Refine the resulting bins using one or both refinement tools:\n\n  - DAS Tool\n  - Binette\n\n## Funding\n\nThis workflow was developed as part of the [**FAIRyMAGs** project](https://elixir-europe.org/how-we-work/scientific-programme/science/bfsp/fairymags), funded as a commissioned service of the [**Biodiversity, Food Security and Pathogens (BFSP) ELIXIR Scientific Programme 2024–2028**](https://elixir-europe.org/how-we-work/scientific-programme/science/bfsp).\n\nThe project was also supported by the **European Galaxy Server**, funded by the German Federal Ministry of Education and Research (BMBF; 031 A538A de.NBI-RBC) and the **Ministry of Science, Research and the Arts Baden-Württemberg (MWK)** within the framework of **LIBIS/de.NBI Freiburg**.\n&quot;],&quot;changelog&quot;:[0,&quot;# Changelog\n\n## [1.0] - 2026-09-23\n\n- First release\n&quot;],&quot;diagrams&quot;:[0,&quot;# Workflow diagrams\n\n## Single-sample binning\n\n```mermaid\ngraph LR\n0[\&quot;ℹ️ Pa
