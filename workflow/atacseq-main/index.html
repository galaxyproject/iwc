cseq.ga&quot;],&quot;testParameterFiles&quot;:[1,[[0,&quot;/atacseq-tests.yml&quot;]]],&quot;authors&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;Lucille Delisle&quot;],&quot;orcid&quot;:[0,&quot;0000-0002-1964-4960&quot;]}]]],&quot;definition&quot;:[0,{&quot;a_galaxy_workflow&quot;:[0,&quot;true&quot;],&quot;annotation&quot;:[0,&quot;Complete ATAC-seq analysis pipeline for paired-end reads. Processes raw FASTQ data through adapter and bad quality removal (fastp), alignment (Bowtie2 end-to-end), and filtering (removes MT reads, discordant pairs, low mapping quality below 30, PCR duplicates). Generates 5&#39; cut site pileups (±100bp), performs peak calling, and quantifies reads in 1kb summit-centered regions. Produces two normalized coverage tracks (per million mapped reads and per million reads in peaks). It also produces TSS enrichment and fragment length distribution plots for quality assessment.&quot;],&quot;comments&quot;:[1,[[0,{&quot;child_steps&quot;:[1,[[0,9],[0,15],[0,18],[0,22],[0,23],[0,29]]],&quot;color&quot;:[0,&quot;orange&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;TSS enrichment QC&quot;]}],&quot;id&quot;:[0,1],&quot;position&quot;:[1,[[0,840.6],[0,1031.8]]],&quot;size&quot;:[1,[[0,1184],[0,614]]],&quot;type&quot;:[0,&quot;frame&quot;]}],[0,{&quot;child_steps&quot;:[1,[[0,19],[0,24],[0,30],[0,32],[0,34],[0,37],[0,39],[0,41]]],&quot;color&quot;:[0,&quot;lime&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Normalize coverages&quot;]}],&quot;id&quot;:[0,4],&quot;position&quot;:[1,[[0,1941.5],[0,1984.1]]],&quot;size&quot;:[1,[[0,1349.2],[0,918.9]]],&quot;type&quot;:[0,&quot;frame&quot;]}],[0,{&quot;child_steps&quot;:[1,[[0,12],[0,14]]],&quot;color&quot;:[0,&quot;turquoise&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;chrM QC&quot;]}],&quot;id&quot;:[0,0],&quot;position&quot;:[1,[[0,1020.8],[0,587.0031092566492]]],&quot;size&quot;:[1,[[0,517.7],[0,269.9]]],&quot;type&quot;:[0,&quot;frame&quot;]}],[0,{&quot;child_steps&quot;:[1,[[0,26],[0,31],[0,33],[0,35],[0,36],[0,38]]],&quot;color&quot;:[0,&quot;green&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Compute reads in peaks QC&quot;]}],&quot;id&quot;:[0,3],&quot;position&quot;:[1,[[0,2370.2],[0,235.30310925664915]]],&quot;size&quot;:[1,[[0,1099.3],[0,799]]],&quot;type&quot;:[0,&quot;frame&quot;]}],[0,{&quot;child_steps&quot;:[1,[[0,17],[0,21],[0,28]]],&quot;color&quot;:[0,&quot;blue&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Fragment length QC&quot;]}],&quot;id&quot;:[0,2],&quot;position&quot;:[1,[[0,1581],[0,602.0031092566492]]],&quot;size&quot;:[1,[[0,774],[0,398]]],&quot;type&quot;:[0,&quot;frame&quot;]}]]],&quot;creator&quot;:[1,[[0,{&quot;class&quot;:[0,&quot;Person&quot;],&quot;identifier&quot;:[0,&quot;https://orcid.org/0000-0002-1964-4960&quot;],&quot;name&quot;:[0,&quot;Lucille Delisle&quot;]}]]],&quot;format-version&quot;:[0,&quot;0.1&quot;],&quot;license&quot;:[0,&quot;MIT&quot;],&quot;name&quot;:[0,&quot;ATAC-seq Analysis: Chromatin Accessibility Profiling&quot;],&quot;readme&quot;:[0,&quot;# ATAC-seq Analysis: Chromatin Accessibility Profiling\n\nThis workflow is highly concordant with the corresponding training material.\nYou can have more information about ATAC-seq analysis in the [slides](https://training.galaxyproject.org/training-material/topics/epigenetics/tutorials/atac-seq/slides.html) and the [tutorial](https://training.galaxyproject.org/training-material/topics/epigenetics/tutorials/atac-seq/tutorial.html).\n\n## Inputs dataset\n\n- A list of dataset pairs of fastqsanger.\n- A GTF file with gene annotations (this is used for the TSS enrichment). This GTF file must have the same chromosome naming convention as the reference genome (chr1 vs 1).\n\n## Inputs values\n\n- Percentage of bad quality bases per read: fastp will discard any read which has more than this percentage of bases with a quality below 30. This depends on your read length.\n- Reference genome: this field will be adapted to the genomes available for bowtie2 and the genomes available for bedtools slopbed (`bowtie2_indexes` and `fasta_indexes` table)\n- Effective genome size: this is used by macs2 and may be entered manually (indications are provided for heavily used genomes)\n- Bin size: this is used when normalization of coverage is performed. Large values will allow to have smaller output files but with less resolution while small values will increase computation time and size of output files to produce more resolutive bigwigs.\n- Compute TSS enrichment Genome-wide: whether you want to compute TSS enrichment Genome-wide or only on a chromosome. Computing genome-wide takes longer so we recommend to leave it to false and specify a chromosome in the next input.\n- Compute TSS enrichment on a specific chromosome: If the above parameter is set to false, you need to specify here a chromosome name that must be part of your GTF and part of your Reference Genome.\n\n## Processing\n\n- The workflow will remove nextera adapters using read overlap and filter out any read smaller than 15bp after adapter removal. All reads with too many low quality bases will be discarded.\n- The filtered reads are mapped with bowtie2 allowing dovetail and fragment length up to 1kb.\n- The BAM is filtered to keep only MAPQ30, concordant pairs and pairs outside of the mitochondria.\n- The PCR duplicates are removed with Picard (only from version 0.8).\n- The BAM is converted to BED to enable MACS2 to take both pairs into account.\n- The peaks are called with MACS2 which at the same time generates a coverage file.\n- The coverage file is converted to bigwig\n- The amount of reads 500bp from summits and the total number of reads are computed.\n- Two normalizations are computed:\n  - By million reads\n  - By million reads in peaks (500bp from summits)\n- Other QC are performed:\n  - A histogram with fragment length is computed.\n  - The evaluation of percentage of reads to chrM or MT is computed.\n  - The TSS enrichment profile and TSS enrichment scores are computed with ATACseqQC.\n- A multiQC is run to have an overview of the QC.\n\n### Warning\n\n- The `reference_genome` parameter value is used to select references in bowtie2 and bedtools slopbed. Only references that are present in bowtie2 **and** bedtools slopbed are selectable. If your favorite reference genome is not available, ask your administrator to make sure that each bowtie2 reference has a corresponding fasta index to use in bedtools slopbed.\n&quot;],&quot;report&quot;:[0,{&quot;markdown&quot;:[0,&quot;\n# Workflow Execution Report\n\n## Workflow Inputs\n```galaxy\ninvocation_inputs()\n```\n\n## Workflow Outputs\n```galaxy\ninvocation_outputs()\n```\n\n## Workflow\n```galaxy\nworkflow_display()\n```\n&quot;]}],&quot;steps&quot;:[0,{&quot;0&quot;:[0,{&quot;annotation&quot;:[0,&quot;Should be a paired collection with ATAC-seq fastqs&quot;],&quot;content_id&quot;:[0,null],&quot;errors&quot;:[0,null],&quot;id&quot;:[0,0],&quot;input_connections&quot;:[0,{}],&quot;inputs&quot;:[1,[[0,{&quot;description&quot;:[0,&quot;Should be a paired collection with ATAC-seq fastqs&quot;],&quot;name&quot;:[0,&quot;PE fastq input&quot;]}]]],&quot;label&quot;:[0,&quot;PE fastq input&quot;],&quot;name&quot;:[0,&quot;Input dataset collection&quot;],&quot;outputs&quot;:[1,[]],&quot;position&quot;:[0,{&quot;left&quot;:[0,0],&quot;top&quot;:[0,546.4031092566491]}],&quot;tool_id&quot;:[0,null],&quot;tool_state&quot;:[0,&quot;{\&quot;optional\&quot;: false, \&quot;tag\&quot;: \&quot;\&quot;, \&quot;collection_type\&quot;: \&quot;list:paired\&quot;, \&quot;fields\&quot;: null, \&quot;column_definitions\&quot;: null}&quot;],&quot;tool_version&quot;:[0,null],&quot;type&quot;:[0,&quot;data_collection_input&quot;],&quot;uuid&quot;:[0,&quot;3b1d869d-e8a9-49d9-894c-8aa500cd445d&quot;],&quot;when&quot;:[0,null],&quot;workflow_outputs&quot;:[1,[]]}],&quot;1&quot;:[0,{&quot;annotation&quot;:[0,&quot;fastp will discard any read which has more than this percentage of ba igwig\&quot;, \&quot;region\&quot;: \&quot;\&quot;, \&quot;__page__\&quot;: null, \&quot;__rerun_remap_job_id__\&quot;: null}&quot;],&quot;tool_uuid&quot;:[0,null],&quot;tool_version&quot;:[0,&quot;4.0.0+galaxy1&quot;],&quot;type&quot;:[0,&quot;tool&quot;],&quot;uuid&quot;:[0,&quot;8eab7f49-605b-462a-9806-da0c795117f3&quot;],&quot;when&quot;:[0,null],&quot;workflow_outputs&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;bigwig_norm2&quot;],&quot;output_name&quot;:[0,&quot;outFileName&quot;],&quot;uuid&quot;:[0,&quot;60031333-7419-4121-a0c7-e235b70a5cfc&quot;]}]]]}]}],&quot;tags&quot;:[1,[[0,&quot;ATACseq&quot;]]],&quot;uuid&quot;:[0,&quot;5f9cc31e-c4df-420b-9f29-996110458b66&quot;],&quot;version&quot;:[0,1],&quot;release&quot;:[0,&quot;2.3&quot;]}],&quot;workflow_job_input&quot;:[0,{&quot;PE fastq input&quot;:[0,{&quot;class&quot;:[0,&quot;Collection&quot;],&quot;collection_type&quot;:[0,&quot;list&quot;],&quot;elements&quot;:[1,[[0,{&quot;class&quot;:[0,&quot;File&quot;],&quot;identifier&quot;:[0,&quot;todo_element_name&quot;],&quot;path&quot;:[0,&quot;todo_test_data_path.ext&quot;]}]]]}],&quot;Reference Genome&quot;:[0,&quot;todo_param_value&quot;],&quot;Effective genome size&quot;:[0,&quot;todo_param_value&quot;],&quot;Bin size&quot;:[0,&quot;todo_param_value&quot;],&quot;Gene annotation file&quot;:[0,{&quot;class&quot;:[0,&quot;File&quot;],&quot;path&quot;:[0,&quot;todo_test_data_path.ext&quot;]}]}],&quot;readme&quot;:[0,&quot;# ATAC-seq Analysis: Chromatin Accessibility Profiling\n\nThis workflow is highly concordant with the corresponding training material.\nYou can have more information about ATAC-seq analysis in the [slides](https://training.galaxyproject.org/training-material/topics/epigenetics/tutorials/atac-seq/slides.html) and the [tutorial](https://training.galaxyproject.org/training-material/topics/epigenetics/tutorials/atac-seq/tutorial.html).\n\n## Inputs dataset\n\n- A list of dataset pairs of fastqsanger.\n- A GTF file with gene annotations (this is used for the TSS enrichment). This GTF file must have the same chromosome naming convention as the reference genome (chr1 vs 1).\n\n## Inputs values\n\n- Percentage of bad quality bases per read: fastp will discard any read which has more than this percentage of bases with a quality below 30. This depends on your read length.\n- Reference genome: this field will be adapted to the genomes available for bowtie2 and the genomes available for bedtools slopbed (`bowtie2_indexes` and `fasta_indexes` table)\n- Effective genome size: this is used by macs2 and may be entered manually (indications are provided for heavily used genomes)\n- Bin size: this is used when normalization of coverage is performed. Large values will allow to have smaller output files but with less resolution while small values will increase computation time and size of output files to produce more resolutive bigwigs.\n- Compute TSS enrichment Genome-wide: whether you want to compute TSS enrichment Genome-wide or only on a chromosome. Computing genome-wide takes longer so we recommend to leave it to false and specify a chromosome in the next input.\n- Compute TSS enrichment on a specific chromosome: If the above parameter is set to false, you need to specify here a chromosome name that must be part of your GTF and part of your Reference Genome.\n\n## Processing\n\n- The workflow will remove nextera adapters using read overlap and filter out any read smaller than 15bp after adapter removal. All reads with too many low quality bases will be discarded.\n- The filtered reads are mapped with bowtie2 allowing dovetail and fragment length up to 1kb.\n- The BAM is filtered to keep only MAPQ30, concordant pairs and pairs outside of the mitochondria.\n- The PCR duplicates are removed with Picard (only from version 0.8).\n- The BAM is converted to BED to enable MACS2 to take both pairs into account.\n- The peaks are called with MACS2 which at the same time generates a coverage file.\n- The coverage file is converted to bigwig\n- The amount of reads 500bp from summits and the total number of reads are computed.\n- Two normalizations are computed:\n  - By million reads\n  - By million reads in peaks (500bp from summits)\n- Other QC are performed:\n  - A histogram with fragment length is computed.\n  - The evaluation of percentage of reads to chrM or MT is computed.\n  - The TSS enrichment profile and TSS enrichment scores are computed with ATACseqQC.\n- A multiQC is run to have an overview of the QC.\n\n### Warning\n\n- The `reference_genome` parameter value is used to select references in bowtie2 and bedtools slopbed. Only references that are present in bowtie2 **and** bedtools slopbed are selectable. If your favorite reference genome is not available, ask your administrator to make sure that each bowtie2 reference has a corresponding fasta index to use in bedtools slopbed.\n&quot;],&quot;changelog&quot;:[0,&quot;# Changelog\n\n## [2.3] - 2026-10-14\n\n### Tool update\n- `toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.3.6+galaxy0` to `toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.4.0+galaxy0`\n- `toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_awk_tool/9.5+galaxy3` to `toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_awk_tool/9.11+galaxy0`\n- `toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_grep_tool/9.5+galaxy3` to `toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_grep_tool/9.11+galaxy0`\n- `toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_slopbed/2.31.1+galaxy0` to `toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_slopbed/2.31.1+galaxy1`\n- `toolshed.g2.bx.psu.edu/repos/bgruening/deeptools_bigwig_average/deeptools_bigwig_average/3.5.4+galaxy0` to `toolshed.g2.bx.psu.edu/repos/bgruening/deeptools_bigwig_average/deeptools_bigwig_average/4.0.0+galaxy1`\n- `toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy1` to `toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5`\n- `toolshed.g2.bx.psu.edu/repos/iuc/table_compute/table_compute/1.2.4+galaxy2` was updated to `toolshed.g2.bx.psu.edu/repos/iuc/table_compute/table_compute/1.2.4+galaxy3`\n\n### Manual changes\n- New input required: a GTF file with the chromosome names matching the targeted genome.\n- New QC with ATACseqQC: TSS enrichment plot is added to MultiQC and TSS enrichment score is computed from a GTF provided by the user, either genome-wide or on a chromosome chosen with the new `Compute TSS enrichment Genome-wide` and `Compute TSS enrichment on a specific chromosome` inputs (default: `chr1`).\n- The fragment size distribution is now normalized to more easily compare between samples with different sequencing depth.\n\n### Other info\n- The change of bedtools implies that the proposed genomes were only the &#39;dbkey&#39; and now are any fasta for which a `fasta_index` has been computed. If you favorite genome disappears contact your galaxy administrator.\n\n## [2.2] - 2026-07-13\n\n### Automatic update\n- `toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.3.5+galaxy0` was updated to `toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.3.6+galaxy0`\n\n## [2.1] - 2026-06-22\n\n### Automatic update\n- `toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.3.1+galaxy0` was updated to `toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.3.5+galaxy0`\n- `toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.33+galaxy2` was updated to `toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy1`\n\n## [2.0] - 2025-10-03\n\n### Tool change\n\n- The workflow now uses fastp instead of cutadapt.\n\n### Tools update\n\n- toolshed.g2.bx.psu.edu/repos/devteam/bowtie2/bowtie2/2.5.3+galaxy1 to toolshed.g2.bx.psu.edu/repos/devteam/bowtie2/bowtie2/2.5.5+galaxy0\n- toolshed.g2.bx.psu.edu/repos/devteam/bamtools_filter/bamFilter/2.5.2+galaxy2 to toolshed.g2.bx.psu.edu/repos/devteam/bamtools_filter/bamFilter/2.5.3+galaxy0\n- toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_idxstats/2.0.5 to toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_
