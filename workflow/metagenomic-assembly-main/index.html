0,&quot;5.3.0+galaxy1&quot;],&quot;type&quot;:[0,&quot;tool&quot;],&quot;uuid&quot;:[0,&quot;c8f04cb2-16ad-47a0-81b1-3c42ef8a885e&quot;],&quot;when&quot;:[0,null],&quot;workflow_outputs&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;Quast assembly quality PDF&quot;],&quot;output_name&quot;:[0,&quot;metrics_pdf&quot;],&quot;uuid&quot;:[0,&quot;ac76abd7-a142-4500-8a8e-2f1cd36aa3f2&quot;]}],[0,{&quot;label&quot;:[0,&quot;Quast report&quot;],&quot;output_name&quot;:[0,&quot;report_tabular_meta&quot;],&quot;uuid&quot;:[0,&quot;ff1874cd-9c8f-4206-96df-34e50c02c870&quot;]}],[0,{&quot;label&quot;:[0,&quot;Quast Krona charts&quot;],&quot;output_name&quot;:[0,&quot;krona&quot;],&quot;uuid&quot;:[0,&quot;d959c461-9e57-488f-90cc-3eccaf364de2&quot;]}],[0,{&quot;label&quot;:[0,&quot;Quast HTML report&quot;],&quot;output_name&quot;:[0,&quot;report_html_meta&quot;],&quot;uuid&quot;:[0,&quot;a0dfcf1d-aae7-4e66-881f-d5aa1b408a47&quot;]}],[0,{&quot;label&quot;:[0,&quot;Quast assembly quality&quot;],&quot;output_name&quot;:[0,&quot;metrics_tabular&quot;],&quot;uuid&quot;:[0,&quot;d075c6c8-fc58-42e1-98cf-542ea73979d4&quot;]}]]]}]}],&quot;tags&quot;:[1,[]],&quot;uuid&quot;:[0,&quot;64c9ed09-702b-4e3d-a207-4b6aa8c9d3fd&quot;],&quot;version&quot;:[0,1]}],&quot;workflow_job_input&quot;:[0,{&quot;Trimmed paired reads from grouped samples&quot;:[0,{&quot;class&quot;:[0,&quot;Collection&quot;],&quot;collection_type&quot;:[0,&quot;list&quot;],&quot;elements&quot;:[1,[[0,{&quot;class&quot;:[0,&quot;File&quot;],&quot;identifier&quot;:[0,&quot;todo_element_name&quot;],&quot;path&quot;:[0,&quot;todo_test_data_path.ext&quot;]}]]]}],&quot;Choose Assembler&quot;:[0,&quot;todo_param_value&quot;]}],&quot;readme&quot;:[0,&quot;# Metagenomic Assembly\n\nThis workflow provides a standardized and modular approach for metagenomic assembly. It generates assemblies from paired-end short reads, with optional support for long reads.\n\nThe workflow is intentionally kept simple so that it can be used as a standalone assembly workflow or integrated as a building block into larger metagenomic analysis workflows.\n\nLong-read input is currently only supported when using **metaSPAdes**. If long reads are provided together with MEGAHIT or Custom Assembly, they are ignored.\n\n## Why use this workflow?\n\nThe main purpose of this workflow is to provide a basic and reusable assembly component that can be incorporated into different metagenomic analysis workflows.\n\nInstead of including assembler-specific steps in every workflow, this workflow provides a common assembly module that can be reused wherever metagenomic assembly is required. This helps reduce duplication between workflows and makes larger workflows easier to understand, maintain, and update.\n\nThis workflow is the assembly section of the [MAGs generation workflow](../mags-building/), extracted so that MAGs generation and other workflows can reuse it instead of maintaining their own copy. It is part of a suite of workflows for end-to-end metagenome-assembled genome (MAG) generation (check the [FAIRyMAGs repository](https://github.com/usegalaxy-eu/FAIRyMAGs) for the complete workflow suite and its capabilities).\nA dedicated [learning pathway](https://galaxyproject.github.io/training-material/learning-pathways/mags.html) provides detailed guidance on MAG generation in Galaxy.\n\nThe workflow requires Galaxy 26.0 or later.\n\n## Workflow Logic\n\nThe workflow supports two commonly used metagenomic assemblers:\n\n  - metaSPAdes\n  - MEGAHIT\n\nThe user can select the assembler depending on the requirements of the analysis. The workflow processes the provided sequencing reads and returns the resulting assembled contigs in a standardized format that can be directly used by downstream workflows.\n\nWhen metaSPAdes is selected, optional long reads can be provided in addition to the paired-end short reads. This allows long-read information to support the assembly while maintaining short reads as the primary input. The long reads are matched to the short reads by element identifier, independently of collection order. Long reads can be supplied for a subset of groups; groups without matching long reads use short reads alone. Long-read elements whose identifiers do not occur in the paired-read collection are ignored.\n\nIt is also possible to skip the assembly part by selecting **Custom Assembly** and providing your own assemblies, for example from an assembler that is not part of this workflow. The custom assemblies must include one FASTA file for every short-read group, with the same element identifiers. They are reordered by identifier before being evaluated with **Quast** and returned as the final assemblies; their input collection order does not matter. Additional assemblies for other groups are ignored. The workflow fails with an error if Custom Assembly is selected but no custom assemblies are provided.\n\n## Inputs\n\nThe required inputs for this workflow are:\n  \n  - Trimmed paired reads in FASTQ format (as a list:paired collection, one element per group of samples to co-assemble)\n  - The chosen Assembler (Options are: MEGAHIT/metaSPAdes/Custom Assembly)\n  - Minimum length of contigs to output (Default: 200). Only applies to MEGAHIT; metaSPAdes contigs are not length-filtered.\n\nThe optional inputs are:\n\n  - Trimmed nanopore reads in FASTQ format (as a list, matching element identifiers for any groups with long reads; metaSPAdes only)\n  - Trimmed PacBio reads in FASTQ format (as a list, matching element identifiers for any groups with long reads; metaSPAdes only)\n  - Custom assemblies in FASTA format (as a list, one assembly per short-read group with matching element identifiers), required when Custom Assembly is selected\n\nQUAST evaluates contigs of at least 500 bases. This fixed evaluation threshold is independent of the minimum contig length used by MEGAHIT.\n\n## Outputs\n\nThe following outputs are generated by the workflow:\n\n  - For every assembler choice:\n    - Final assemblies: the MEGAHIT or metaSPAdes contigs, or the custom assemblies\n    - Quast HTML report\n    - Quast report (tabular)\n    - Quast assembly quality report (tabular and as PDF)\n    - Quast Krona charts\n  - Additionally, when metaSPAdes is selected:\n    - metaSPAdes assembly graph\n    - metaSPAdes assembly graph with scaffolds\n    - metaSPAdes scaffolds\n\n## Funding\n\nThis workflow was developed as part of the [**FAIRyMAGs** project](https://elixir-europe.org/how-we-work/scientific-programme/science/bfsp/fairymags), funded as a commissioned service of the [**Biodiversity, Food Security and Pathogens (BFSP) ELIXIR Scientific Programme 2024–2028**](https://elixir-europe.org/how-we-work/scientific-programme/science/bfsp).\n\nThe project was also supported by the **European Galaxy Server**, funded by the German Federal Ministry of Education and Research (BMBF; 031 A538A de.NBI-RBC) and the **Ministry of Science, Research and the Arts Baden-Württemberg (MWK)** within the framework of **LIBIS/de.NBI Freiburg**.\n&quot;],&quot;changelog&quot;:[0,&quot;# Changelog\n\n## [1.0] - 2026-09-29\n\n- First release\n&quot;],&quot;diagrams&quot;:[0,&quot;# Workflow diagrams\n\n## Metagenomic Assembly\n\n```mermaid\ngraph LR\n0[\&quot;create text file\&quot;]@{ shape: process }\n1[\&quot;ℹ️ Trimmed paired reads from grouped samples\&quot;]@{ shape: docs }\n2[\&quot;ℹ️ Trimmed nanopore reads from grouped samples\&quot;]@{ shape: docs }\n3[\&quot;ℹ️ Trimmed PacBio reads from grouped samples\&quot;]@{ shape: docs }\n4[\&quot;ℹ️ Choose Assembler\&quot;]@{ shape: lean-l }\n5[\&quot;ℹ️ Minimum length of contigs to output\&quot;]@{ shape: lean-l }\n6[\&quot;ℹ️ Custom Assemblies\&quot;]@{ shape: docs }\n7[\&quot;Select\&quot;]@{ shape: process }\n0 --&gt; 7\n8[\&quot;Extract reads element identifiers\&quot;]@{ shape: process }\n1 --&gt; 8\n9[\&quot;Apply rules\&quot;]@{ shape: process }\n1 --&gt; 9\n10[\&quot;Unzip paired reads\&quot;]@{ shape: process }\n1 --&gt; 10\n11[\&quot
