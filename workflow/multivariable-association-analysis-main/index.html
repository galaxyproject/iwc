e&quot;:[1,[[0,1500],[0,150]]],&quot;type&quot;:[0,&quot;markdown&quot;]}],[0,{&quot;child_steps&quot;:[1,[[0,15]]],&quot;color&quot;:[0,&quot;none&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Internal: positive-control routing&quot;]}],&quot;id&quot;:[0,6],&quot;position&quot;:[1,[[0,775.3],[0,2379.9]]],&quot;size&quot;:[1,[[0,300],[0,320]]],&quot;type&quot;:[0,&quot;frame&quot;]}],[0,{&quot;child_steps&quot;:[1,[[0,20]]],&quot;color&quot;:[0,&quot;blue&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;3A. Negative-control QC &amp;amp; decontamination&quot;]}],&quot;id&quot;:[0,5],&quot;position&quot;:[1,[[0,1937.7],[0,159.3]]],&quot;size&quot;:[1,[[0,330],[0,850]]],&quot;type&quot;:[0,&quot;frame&quot;]}],[0,{&quot;color&quot;:[0,&quot;none&quot;],&quot;data&quot;:[0,{&quot;text&quot;:[0,&quot;## 3A. Negative-control QC &amp; decontamination\n\nThe optional subworkflow resolves the negative-control metadata column, visualises negative controls, and performs decontamination. Enter `0` for the negative-control column to skip this branch.&quot;]}],&quot;id&quot;:[0,4],&quot;position&quot;:[1,[[0,1924.4],[0,0]]],&quot;size&quot;:[1,[[0,1060],[0,140]]],&quot;type&quot;:[0,&quot;markdown&quot;]}],[0,{&quot;child_steps&quot;:[1,[[0,13],[0,17],[0,18]]],&quot;color&quot;:[0,&quot;turquoise&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2. Prepare analysis data&quot;]}],&quot;id&quot;:[0,3],&quot;position&quot;:[1,[[0,847.5],[0,1401.8]]],&quot;size&quot;:[1,[[0,1100],[0,390]]],&quot;type&quot;:[0,&quot;frame&quot;]}],[0,{&quot;color&quot;:[0,&quot;none&quot;],&quot;data&quot;:[0,{&quot;text&quot;:[0,&quot;## 2. Prepare analysis data\n\nThe input phyloseq object is prepared for downstream analysis and the metadata are used to determine which optional control branches should be executed.&quot;]}],&quot;id&quot;:[0,2],&quot;position&quot;:[1,[[0,836.7],[0,1246.3]]],&quot;size&quot;:[1,[[0,1040],[0,130]]],&quot;type&quot;:[0,&quot;markdown&quot;]}],[0,{&quot;child_steps&quot;:[1,[[0,5],[0,2],[0,0],[0,1],[0,3],[0,4]]],&quot;color&quot;:[0,&quot;none&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;1. Data &amp;amp; control inputs&quot;]}],&quot;id&quot;:[0,1],&quot;position&quot;:[1,[[0,0],[0,1362.5]]],&quot;size&quot;:[1,[[0,520],[0,820]]],&quot;type&quot;:[0,&quot;frame&quot;]}]]],&quot;creator&quot;:[1,[[0,{&quot;class&quot;:[0,&quot;Person&quot;],&quot;identifier&quot;:[0,&quot;https://orcid.org/0000-0001-9047-4215&quot;],&quot;name&quot;:[0,&quot;Engy Nasr&quot;]}],[0,{&quot;class&quot;:[0,&quot;Person&quot;],&quot;identifier&quot;:[0,&quot;https://orcid.org/0000-0003-2982-388X&quot;],&quot;name&quot;:[0,&quot;Paul Zierep&quot;]}],[0,{&quot;class&quot;:[0,&quot;Person&quot;],&quot;name&quot;:[0,&quot;Mara Besemer&quot;],&quot;url&quot;:[0,&quot;https://github.com/MaraBesemer&quot;]}]]],&quot;format-version&quot;:[0,&quot;0.1&quot;],&quot;license&quot;:[0,&quot;MIT&quot;],&quot;logo_url&quot;:[0,&quot;https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/amplicon/multivariable-association-analysis/logo.png&quot;],&quot;name&quot;:[0,&quot;Multivariable Association Analysis of Amplicon Data&quot;],&quot;readme&quot;:[0,&quot;# Multivariable Association Analysis of Amplicon Data\n\nThis workflow performs downstream analysis of processed amplicon sequencing\ndata, starting from a phyloseq object (ASV/OTU abundance table and taxonomy)\nand a matching sample metadata table. It covers sequencing-control QC,\ncontaminant identification and removal with Decontam, batch-effect correction\nwith MMUPHin, taxonomic agglomeration and multivariable association analysis\nwith MaAsLin3.\n\n## Relationship to other IWC amplicon workflows\n\nThis workflow starts where the amplicon processing workflows stop. Reads can\nfirst be processed with workflows such as DADA2 or with tools such as Lotus2\nto obtain a phyloseq object. Use this workflow to analyse that phyloseq object\ntogether with the sample metadata.\n\n## Inputs\n\n- **Phyloseq object**: ASV/OTU abundance table with a 7-rank taxonomy\n  (Kingdom, Phylum, Class, Order, Family, Genus, Species).\n- **Metadata**: tabular sample metadata with a header line. The first column\n  must contain the sample identifiers, matching the sample names in the\n  phyloseq object.\n- **Negative-control column number (0 = none)**: metadata column with binary\n  `0`/`1` values, where `1` marks a negative control sample. Enter `0` if the\n  data has no negative controls; Decontam and the negative-control QC are then\n  skipped.\n- **Positive-control column number (0 = none)**: metadata column with binary\n  `0`/`1` values, where `1` marks a positive control sample. Enter `0` if the\n  data has no positive controls.\n- **Batch-ID column number (0 = none)**: metadata column with the batch\n  identifier used by MMUPHin. Enter `0` to skip batch-effect correction.\n- **Decontam threshold**: probability threshold used by Decontam to classify\n  features as contaminants (default `0.1`).\n- **MaAsLin3 model formula**: formula using metadata column names, without the\n  leading `~` (for example `disease + age`). See the\n  [MaAsLin3 tutorial](https://www.bioconductor.org/packages/release/bioc/vignettes/maaslin3/inst/doc/maaslin3_tutorial.html) for\n  the syntax.\n- **MaAsLin3 reference level**: reference for a categorical variable, written\n  as `variable,reference`.\n- **MaAsLin3 maximum significance (q-value)**, **normalization**,\n  **transformation** and **q-value correction**: passed to both MaAsLin3 runs.\n- **Taxonomic agglomeration rank**: rank used to agglomerate features before\n  the taxonomic-level MaAsLin3 run, for example `Genus` or `Family`.\n\n## What the workflow does\n\n1. Negative controls, if provided, are used by Decontam to identify and remove\n   contaminant ASVs. QC heatmaps and ordinations of the control samples are\n   produced before and after decontamination.\n2. Negative- and positive-control samples are removed, giving the\n   analysis-ready data.\n3. The workflow then splits into two independent branches:\n   - **MMUPHin batch-effect correction** produces a batch-corrected ASV table\n     and phyloseq object for use in any further analysis.\n   - **MaAsLin3** is run on the analysis-ready data *before* batch correction,\n     both at ASV level and after agglomeration to the selected taxonomic rank. MaAsLin3 models\n     covariates directly, so to account for batch effects, add the batch\n     variable to the MaAsLin3 model formula instead of using the MMUPHin\n     output.\n\n## Outputs\n\n- Decontam plots and control-QC heatmaps and ordinations (only when the\n  corresponding controls are provided).\n- Analysis-ready phyloseq object (controls and contaminants removed, before\n  batch correction).\n- MMUPHin batch-corrected ASV table, phyloseq object and diagnostic plot (only\n  when a batch column is provided).\n- MaAsLin3 results at ASV level and at the selected taxonomic level: all results, significant\n  features and a summary plot.\n- Volcano plot of the ASV-level MaAsLin3 results (abundance model).\n\n\nOptional branches are embedded subworkflows. Only the five subworkflow steps carry when conditions. Original fallback routing and analysis settings are preserved.\n&quot;],&quot;report&quot;:[0,{&quot;markdown&quot;:[0,&quot;# Multivariable Association Analysis of Amplicon Data\n\n## Inputs\n```galaxy\ninvocation_inputs()\n```\n\n## Key outputs\n```galaxy\ninvocation_outputs()\n```\n\n## Workflow overview\n```galaxy\nworkflow_display()\n```\n\n**Design note:** MMUPHin batch correction is a separate output branch. MaAsLin3 intentionally uses the control-filtered data before MMUPHin correction.\n&quot;]}],&quot;steps&quot;:[0,{&quot;0&quot;:[0,{&quot;annotation&quot;:[0,&quot;Phyloseq object containing the ASV abundance table and taxonomy information used as input for downstream decontamination, batch-effect correction, and differential abundance analysis.&quot;],&quot;conten uot;workflow_outputs&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;MaAsLin3 volcano plot (ASV level) prevalence&quot;],&quot;output_name&quot;:[0,&quot;plot&quot;],&quot;uuid&quot;:[0,&quot;be35af73-0f67-4e9d-bdea-f275ab5077fa&quot;]}]]]}]}],&quot;tags&quot;:[1,[[0,&quot;microbiome&quot;],[0,&quot;amplicon&quot;],[0,&quot;ASV&quot;],[0,&quot;decontamination&quot;],[0,&quot;batch-effect-correction&quot;],[0,&quot;differential-abundance&quot;]]],&quot;uuid&quot;:[0,&quot;13118b29-66de-4343-b092-0e751d7d6b31&quot;],&quot;version&quot;:[0,1],&quot;release&quot;:[0,&quot;0.1&quot;]}],&quot;workflow_job_input&quot;:[0,{&quot;Phyloseq object&quot;:[0,{&quot;class&quot;:[0,&quot;File&quot;],&quot;path&quot;:[0,&quot;todo_test_data_path.ext&quot;]}],&quot;Metadata&quot;:[0,{&quot;class&quot;:[0,&quot;File&quot;],&quot;path&quot;:[0,&quot;todo_test_data_path.ext&quot;]}],&quot;Negative-control column number (0 = none)&quot;:[0,&quot;todo_param_value&quot;],&quot;Positive-control column number (0 = none)&quot;:[0,&quot;todo_param_value&quot;],&quot;Batch-ID column number (0 = none)&quot;:[0,&quot;todo_param_value&quot;],&quot;MaAsLin3 model formula&quot;:[0,&quot;todo_param_value&quot;],&quot;MaAsLin3 reference level&quot;:[0,&quot;todo_param_value&quot;],&quot;Taxonomic agglomeration rank&quot;:[0,&quot;todo_param_value&quot;]}],&quot;readme&quot;:[0,&quot;# Multivariable Association Analysis of Amplicon Data\n\nThis workflow performs downstream analysis of processed amplicon sequencing\ndata, starting from a phyloseq object (ASV/OTU abundance table and taxonomy)\nand a matching sample metadata table. It covers sequencing-control QC,\ncontaminant identification and removal with Decontam, batch-effect correction\nwith MMUPHin, taxonomic agglomeration and multivariable association analysis\nwith MaAsLin3.\n\n## Relationship to other IWC amplicon workflows\n\nThis workflow starts where the amplicon processing workflows stop. Reads can\nfirst be processed with workflows such as DADA2 or with tools such as Lotus2\nto obtain a phyloseq object. Use this workflow to analyse that phyloseq object\ntogether with the sample metadata.\n\n## Inputs\n\n- **Phyloseq object**: ASV/OTU abundance table with a 7-rank taxonomy\n  (Kingdom, Phylum, Class, Order, Family, Genus, Species).\n- **Metadata**: tabular sample metadata with a header line. The first column\n  must contain the sample identifiers, matching the sample names in the\n  phyloseq object.\n- **Negative-control column number (0 = none)**: metadata column with binary\n  `0`/`1` values, where `1` marks a negative control sample. Enter `0` if the\n  data has no negative controls; Decontam and the negative-control QC are then\n  skipped.\n- **Positive-control column number (0 = none)**: metadata column with binary\n  `0`/`1` values, where `1` marks a positive control sample. Enter `0` if the\n  data has no positive controls.\n- **Batch-ID column number (0 = none)**: metadata column with the batch\n  identifier used by MMUPHin. Enter `0` to skip batch-effect correction.\n- **Decontam threshold**: probability threshold used by Decontam to classify\n  features as contaminants (default `0.1`).\n- **MaAsLin3 model formula**: formula using metadata column names, without the\n  leading `~` (for example `disease + age`). See the\n  [MaAsLin3 tutorial](https://www.bioconductor.org/packages/release/bioc/vignettes/maaslin3/inst/doc/maaslin3_tutorial.html) for\n  the syntax.\n- **MaAsLin3 reference level**: reference for a categorical variable, written\n  as `variable,reference`.\n- **MaAsLin3 maximum significance (q-value)**, **normalization**,\n  **transformation** and **q-value correction**: passed to both MaAsLin3 runs.\n- **Taxonomic agglomeration rank**: rank used to agglomerate features before\n  the taxonomic-level MaAsLin3 run, for example `Genus` or `Family`.\n\n## What the workflow does\n\n1. Negative controls, if provided, are used by Decontam to identify and remove\n   contaminant ASVs. QC heatmaps and ordinations of the control samples are\n   produced before and after decontamination.\n2. Negative- and positive-control samples are removed, giving the\n   analysis-ready data.\n3. The workflow then splits into two independent branches:\n   - **MMUPHin batch-effect correction** produces a batch-corrected ASV table\n     and phyloseq object for use in any further analysis.\n   - **MaAsLin3** is run on the analysis-ready data *before* batch correction,\n     both at ASV level and after agglomeration to the selected taxonomic rank. MaAsLin3 models\n     covariates directly, so to account for batch effects, add the batch\n     variable to the MaAsLin3 model formula instead of using the MMUPHin\n     output.\n\n## Outputs\n\n- Decontam plots and control-QC heatmaps and ordinations (only when the\n  corresponding controls are provided).\n- Analysis-ready phyloseq object (controls and contaminants removed, before\n  batch correction).\n- MMUPHin batch-corrected ASV table, phyloseq object and diagnostic plot (only\n  when a batch column is provided).\n- MaAsLin3 results at ASV level and at the selected taxonomic level: all results, significant\n  features and a summary plot.\n- Volcano plot of the ASV-level MaAsLin3 results (abundance model).\n&quot;],&quot;changelog&quot;:[0,&quot;# Changelog\n\n## [0.1] - 2026-09-28\n\nInitial release.&quot;],&quot;diagrams&quot;:[0,&quot;# Workflow diagrams\n\n## Multivariable Association Analysis of Amplicon Data\n\n```mermaid\ngraph LR\n0[\&quot;ℹ️ Phyloseq object\&quot;]@{ shape: doc }\n1[\&quot;ℹ️ Metadata\&quot;]@{ shape: doc }\n2[\&quot;ℹ️ Negative-control column number (0 = none)\&quot;]@{ shape: lean-l }\n3[\&quot;ℹ️ Positive-control column number (0 = none)\&quot;]@{ shape: lean-l }\n4[\&quot;ℹ️ Batch-ID column number (0 = none)\&quot;]@{ shape: lean-l }\n5[\&quot;ℹ️ Decontam threshold\&quot;]@{ shape: lean-l }\n6[\&quot;ℹ️ MaAsLin3 model formula\&quot;]@{ shape: lean-l }\n7[\&quot;ℹ️ MaAsLin3 reference level\&quot;]@{ shape:
