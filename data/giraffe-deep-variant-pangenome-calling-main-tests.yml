- doc: Test outline for Pangenome-Variant-Calling-using-VG-Giraffe-and-Google-DeepVariant
  job:
    DeepVariant Haploid Contigs: null
    DeepVariant Keep Legacy Allele Counter: false
    DeepVariant Maximum Read Length to Realign: '500'
    DeepVariant Minimum Mapping Quality: null
    DeepVariant Model Type: WGS
    DeepVariant Normalize Reads: true
    DeepVariant Realign Reads: true
    DeepVariant Small Model Disabled: false
    DeepVariant make_examples Extra Args: null
    Giraffe Mapper Options: null
    Giraffe Maximum Fragment Length: '3000'
    Giraffe Preset: default
    Giraffe Prune Low Complexity: true
    Input Graph:
      class: File
      filetype: gbz
      location: https://zenodo.org/records/22298869/files/GBZ_FILE.gbz?download=1
    Input Read 1:
      class: File
      filetype: fastqsanger.gz
      location: https://zenodo.org/records/22298869/files/Read_1.fastqsanger.gz?download=1
    Input Read 2:
      class: File
      filetype: fastqsanger.gz
      location: https://zenodo.org/records/22298869/files/Read_2.fastqsanger.gz?download=1
    Input XG Graph: null
    Reads per Chunk: '20000000'
    Reference Prefix: null
    Sample Name: s0
    hap.py Target Regions: null
  outputs:
    BAM:
      element_test:
        delta: 5000
        has_size: 117467
    DeepVariant VCF:
      asserts:
      - line: '##fileformat=VCFv4.2'
        n: 1
        that: has_line
      - n: 146
        that: has_n_lines
      - n: 59
        text: chr1
        that: has_text
      - n: 63
        text: chr2
        that: has_text
      - line: "#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\ts0"
        n: 1
        that: has_line
      - line: "chr1\t1123\t.\tA\tG\t30\tPASS\t.\tGT:GQ:DP:AD:VAF:MID:PL\t0/1:30:30:17,13:0.433333:small_model:29,0,51"
        n: 1
        that: has_line
    DeepVariant gVCF:
      asserts:
      - line: '##fileformat=VCFv4.2'
        n: 1
        that: has_line
      - n: 363
        that: has_n_lines
      - n: 173
        text: chr1
        that: has_text
      - n: 166
        text: chr2
        that: has_text
      - line: "#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\ts0"
        n: 1
        that: has_line
      - line: "chr1\t1\t.\tA\t<*>\t0\t.\tEND=34\tGT:GQ:MIN_DP:PL\t0/0:1:0:0,0,0"
        n: 1
        that: has_line
    Unmapped reads BAM:
      element_test:
        delta: 50
        has_size: 494
