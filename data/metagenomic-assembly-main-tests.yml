- doc: MEGAHIT ignores long reads with unrelated identifiers and different group counts
  job:
    Choose Assembler: MEGAHIT
    Custom Assemblies: null
    Minimum length of contigs to output: 100
    Trimmed PacBio reads from grouped samples:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: fastqsanger
        identifier: unrelated_pacbio_1
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/microbiome/metagenomic-assembly/test-data/unused-long-reads.fastq
      - class: File
        filetype: fastqsanger
        identifier: unrelated_pacbio_2
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/microbiome/metagenomic-assembly/test-data/unused-long-reads.fastq
    Trimmed nanopore reads from grouped samples:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: fastqsanger
        identifier: unrelated_nanopore
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/microbiome/metagenomic-assembly/test-data/unused-long-reads.fastq
    Trimmed paired reads from grouped samples:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/19235149/files/test_minigut_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/19235149/files/test_minigut_R2.fastq.gz
        identifier: test_minigut
  outputs:
    Final assemblies:
      class: Collection
      element_tests:
        test_minigut:
          asserts:
          - has_text:
              text: '>'
          - has_size:
              delta: 250000
              value: 1827686
    Quast HTML report:
      class: Collection
      element_tests:
        test_minigut:
          asserts:
          - has_size:
              delta: 20000
              value: 382796
    Quast report:
      class: Collection
      element_tests:
        test_minigut:
          asserts:
          - has_n_lines:
              delta: 5
              n: 22
