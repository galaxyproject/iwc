    Choose Assembler: Custom Assembly
    Custom Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: fasta
        identifier: test_minigut
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/microbiome/metagenomic-assembly/test-data/custom-contigs.fasta
      - class: File
        filetype: fasta
        identifier: marine_pooled
        location: https://zenodo.org/records/17107943/files/workflow_test_assamble.fasta
    Minimum length of contigs to output: 200
    Trimmed PacBio reads from grouped samples:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: fastqsanger
        identifier: unrelated_pacbio
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/microbiome/metagenomic-assembly/test-data/unused-long-reads.fastq
    Trimmed nanopore reads from grouped samples:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: fastqsanger
        identifier: unrelated_1
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/microbiome/metagenomic-assembly/test-data/unused-long-reads.fastq
      - class: File
        filetype: fastqsanger
        identifier: unrelated_2
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/microbiome/metagenomic-assembly/test-data/unused-long-reads.fastq
      - class: File
        filetype: fastqsanger
        identifier: unrelated_3
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/microbiome/metagenomic-assembly/test-data/unused-long-reads.fastq
    Trimmed paired reads from grouped samples:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger
          identifier: forward
          location: https://zenodo.org/records/17107943/files/workflow_test_forward.fastqsanger
        - class: File
          filetype: fastqsanger
          identifier: reverse
          location: https://zenodo.org/records/17107943/files/workflow_test_reverse.fastqsanger
        identifier: marine_pooled
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/19235149/files/test_minigut_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/19235149/files/test_minigut_R2.fastq.gz
        identifier: test_minigut
  outputs:
    Final assemblies:
      class: Collection
      element_tests:
        marine_pooled:
          asserts:
          - has_size:
              value: 13587784
        test_minigut:
          asserts:
          - has_text:
              text: '>custom_minigut_contig'
          - has_size:
              value: 2043
    Quast report:
      class: Collection
      element_tests:
        marine_pooled:
          asserts:
          - has_n_lines:
              delta: 5
              n: 22
        test_minigut:
          asserts:
          - has_text_matching:
              expression: Total length\s+2000
          - has_n_lines:
              delta: 5
              n: 22
