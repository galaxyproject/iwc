- doc: Test for Metagenomic Assembly with a custom assembly
  job:
    Choose Assembler: Custom Assembly
    Custom Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: fasta
        identifier: marine_pooled
        location: https://zenodo.org/records/17107943/files/workflow_test_assamble.fasta
    Minimum length of contigs to output: 200
    Trimmed PacBio reads from grouped samples: null
    Trimmed nanopore reads from grouped samples: null
    Trimmed paired reads from grouped samples:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger
          identifier: forward
          location: https://zenodo.org/records/17107943/files/workflow_test_forward.fastqsanger
        - class: File
          filetype: fastqsanger
          identifier: reverse
          location: https://zenodo.org/records/17107943/files/workflow_test_reverse.fastqsanger
        identifier: marine_pooled
  outputs:
    Final assemblies:
      class: Collection
      element_tests:
        marine_pooled:
          asserts:
          - has_size:
              value: 13587784
    Quast report:
      class: Collection
      element_tests:
        marine_pooled:
          asserts:
          - has_n_lines:
              delta: 5
              n: 22
- doc: Custom assemblies are matched by identifier even when their collection order
    is reversed; unused long reads are ignored
