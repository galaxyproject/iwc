- doc: Regression test for a sample without terms of some annotation types (sample_B
    has no GO, EC, KEGG pathway/module/reaction/rclass, TC, CAZy or BiGG terms); per-sample
    columns must stay aligned. sample_A also has a multi-letter COG category (KT).
  job:
    eggNOG-mapper annotations:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: tabular
        identifier: sample_A
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/genome_annotation/functional-annotation/eggnog-mapper-abundance-tables/test-data/synthetic_sample_A.eggnog-mapper.tabular
      - class: File
        filetype: tabular
        identifier: sample_B
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/genome_annotation/functional-annotation/eggnog-mapper-abundance-tables/test-data/synthetic_sample_B.eggnog-mapper.tabular
      - class: File
        filetype: tabular
        identifier: sample_C
        location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/genome_annotation/functional-annotation/eggnog-mapper-abundance-tables/test-data/synthetic_sample_C.eggnog-mapper.tabular
  outputs:
    BRITE abundances (eggNOG-mapper):
      asserts:
      - n: 4
        that: has_n_lines
      - comment: '#'
        n: 4
        that: has_n_columns
      - line: "ko01000\t1\t0\t1"
        that: has_line
    BiGG reaction abundances (eggNOG-mapper):
      asserts:
      - n: 3
        that: has_n_lines
      - comment: '#'
        n: 4
        that: has_n_columns
      - line: "PROD5\t1\t0\t1"
        that: has_line
    CAZy abundances (eggNOG-mapper):
      asserts:
      - n: 3
        that: has_n_lines
      - comment: '#'
        n: 4
        that: has_n_columns
      - line: "GT2\t1\t0\t1"
        that: has_line
    COG category abundances (eggNOG-mapper):
