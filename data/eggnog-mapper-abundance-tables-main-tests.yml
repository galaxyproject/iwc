        n: 4
        that: has_n_columns
      - line: "K\t2\t0\t0"
        that: has_line
      - line: "T\t1\t0\t2"
        that: has_line
      - line: "unannotated\t0\t1\t0"
        that: has_line
      - text: KT
        that: not_has_text
    EC abundances (eggNOG-mapper):
      asserts:
      - n: 4
        that: has_n_lines
      - comment: '#'
        n: 4
        that: has_n_columns
      - line: "1.2.1.41\t0\t0\t1"
        that: has_line
    GO abundances (eggNOG-mapper):
      asserts:
      - n: 4
        that: has_n_lines
      - line: "#KEY\tsample_A\tsample_B\tsample_C"
        that: has_line
      - comment: '#'
        n: 4
        that: has_n_columns
      - line: "GO:0003674\t2\t0\t1"
        that: has_line
      - line: "GO:0008150\t1\t0\t2"
        that: has_line
      - line: "unannotated\t0\t2\t0"
        that: has_line
    KEGG KO abundances (eggNOG-mapper):
      asserts:
      - n: 4
        that: has_n_lines
      - comment: '#'
        n: 4
        that: has_n_columns
      - line: "ko:K00931\t1\t1\t0"
