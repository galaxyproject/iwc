- doc: Test outline for filter-a-matrix-by-highly-variable-features
  job:
    input table:
      class: File
      filetype: tabular
      location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/text-manipulation/filter-matrix-by-highly-variable-features/test-data/input.tabular
    number of features to keep: 500
  outputs:
    Filtered matrix of highly variable features:
      asserts:
      - expression: "gene\tMB-2960\tMB-0511"
        that: has_text_matching
      - n: 4
        that: has_n_columns
      - expression: NAV3
        that: has_text_matching
      - text: CTTN
        that: not_has_text
      - n: 501
        that: has_n_lines
