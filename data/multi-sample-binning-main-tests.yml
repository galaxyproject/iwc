- doc: Test for multi-sample-binning (Both)
  job:
    Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: fasta
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        filetype: fasta
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
      - class: File
        filetype: fasta
        identifier: Mock3
        location: https://zenodo.org/records/22982485/files/Mock3.fasta
      - class: File
        filetype: fasta
        identifier: Mock4
        location: https://zenodo.org/records/22982485/files/Mock4.fasta
      - class: File
        filetype: fasta
        identifier: Mock5
        location: https://zenodo.org/records/22982485/files/Mock5.fasta
    Bin refinement tool: Both
    CheckM2 Database: 1.0.2
    Paired-end reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
        identifier: Mock1
        type: paired
      - class: Collection
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
        identifier: Mock2
        type: paired
      - class: Collection
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock3_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock3_R2.fastq.gz
        identifier: Mock3
        type: paired
      - class: Collection
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock4_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock4_R2.fastq.gz
        identifier: Mock4
        type: paired
      - class: Collection
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock5_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock5_R2.fastq.gz
        identifier: Mock5
        type: paired
    Read length (CONCOCT): 100
    Run COMEBin?: true
  outputs:
    Binette bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    Binette final bin quality report:
      element_tests:
        Mock4:
          asserts:
          - has_text:
              text: completeness
          - has_n_lines:
              min: 2
        Mock5:
          asserts:
          - has_text:
              text: completeness
          - has_n_lines:
              min: 2
    Binette input bin quality reports:
      element_tests:
        Mock4:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
              - has_text:
                  text: completeness
              - has_n_lines:
                  min: 2
        Mock5:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
              - has_text:
                  text: completeness
              - has_n_lines:
                  min: 2
    COMEBin bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    CONCOCT bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    DAS Tool bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    DAS Tool contigs2bin report:
      element_tests:
        Mock4:
          asserts:
          - has_n_lines:
              min: 100
          - has_line_matching:
              expression: ^\S+\t\S+$
        Mock5:
          asserts:
          - has_n_lines:
              min: 100
          - has_line_matching:
              expression: ^\S+\t\S+$
    DAS Tool summary:
      element_tests:
        Mock4:
          asserts:
          - has_text:
              text: SCG_completeness
          - has_n_lines:
              min: 2
        Mock5:
          asserts:
          - has_text:
              text: SCG_completeness
          - has_n_lines:
              min: 2
    MaxBin2 bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    MetaBAT2 bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    SemiBin bins:
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
