- doc: Test outline for dna-seq-classification-lstm.ga (fixed-length sequences)
  job:
    Batch size: 32
    DNA sequence labels:
      class: File
      filetype: tabular
      location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/machine-learning/dna-seq-classification-lstm/test-data/dna-sequence-labels.tabular
    DNA sequences:
      class: File
      filetype: fasta
      location: https://raw.githubusercontent.com/galaxyproject/iwc/main/workflows/machine-learning/dna-seq-classification-lstm/test-data/dna-sequence.fasta
    Dense layer units: 64
    Embedding output dimensions: 128
    K-mer size: 3
    LSTM layer units: 256
    Number of training epochs: 10
  outputs:
    Confusion matrix (test set):
      asserts:
        has_image_height:
          height: 875
        has_image_width:
          width: 875
    Encoding vocabulary:
      asserts:
      - text: '"EI": 0'
        that: has_text
    Evaluation metrics (validation set):
      asserts:
        has_n_columns:
          n: 5
        has_n_lines:
          n: 2
        has_text:
          text: f1_macro
    Predicted label probabilities (test set):
      asserts:
        has_n_columns:
          n: 3
        has_n_lines:
          n: 320
    Predicted labels (test set):
      asserts:
        has_n_columns:
          n: 1
        has_n_lines:
          n: 320
        has_text:
          text: Predicted
- doc: Test outline for dna-seq-classification-lstm.ga (variable-length sequences)
