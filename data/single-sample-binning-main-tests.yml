- doc: Test for single-sample-binning (Binette only)
  job:
    Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        filetype: fasta
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        filetype: fasta
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
      - class: File
        filetype: fasta
        identifier: Mock3
        location: https://zenodo.org/records/22982485/files/Mock3.fasta
      - class: File
        filetype: fasta
        identifier: Mock4
        location: https://zenodo.org/records/22982485/files/Mock4.fasta
      - class: File
        filetype: fasta
        identifier: Mock5
        location: https://zenodo.org/records/22982485/files/Mock5.fasta
    Bin refinement tool: Binette
    CheckM2 Database: 1.0.2
    Contamination weight (Binette): 2
    Environment for the built-in model (SemiBin): global
    Minimum MAG completeness percentage: 40
    Paired-end reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
        identifier: Mock1
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
        identifier: Mock2
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock3_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock3_R2.fastq.gz
        identifier: Mock3
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock4_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock4_R2.fastq.gz
        identifier: Mock4
      - class: Collection
        collection_type: paired
        elements:
        - class: File
          filetype: fastqsanger.gz
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock5_R1.fastq.gz
        - class: File
          filetype: fastqsanger.gz
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock5_R2.fastq.gz
        identifier: Mock5
    Run COMEBin?: 'No'
  outputs:
    Binette bins:
      class: Collection
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    Binette final bin quality report:
      class: Collection
      element_tests:
        Mock4:
          asserts:
          - has_n_lines:
              delta: 1
              n: 4
        Mock5:
          asserts:
          - has_n_lines:
              delta: 1
              n: 5
    Binette input bin quality reports:
      class: Collection
      element_tests:
        Mock4:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
              - has_n_lines:
                  delta: 2
                  n: 9
        Mock5:
          class: Collection
          elements:
            input_bins_1.bin_table_0:
              asserts:
              - has_n_lines:
                  delta: 2
                  n: 58
    COMEBin bins:
      class: Collection
      element_tests:
        Mock4:
          class: Collection
          count: 0
        Mock5:
          class: Collection
          count: 0
    CONCOCT bins:
      class: Collection
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    Coverage depth matrices:
      class: Collection
      element_tests:
        Mock1:
          asserts:
          - text: contigName
            that: has_text
          - n: 5
            that: has_n_columns
        Mock2:
          asserts:
          - text: contigName
            that: has_text
          - n: 5
            that: has_n_columns
        Mock3:
          asserts:
          - text: contigName
            that: has_text
          - n: 5
            that: has_n_columns
        Mock4:
          asserts:
          - text: contigName
            that: has_text
          - n: 5
            that: has_n_columns
        Mock5:
          asserts:
          - text: contigName
            that: has_text
          - n: 5
            that: has_n_columns
    MaxBin2 bins:
      class: Collection
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    MetaBAT2 bins:
      class: Collection
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
    SemiBin bins:
      class: Collection
      element_tests:
        Mock4:
          class: Collection
          min: 1
        Mock5:
          class: Collection
          min: 1
